<meta charset="utf-8">
<div id="wise-app">
<style>
#wise-app *,#wise-app *::before,#wise-app *::after{box-sizing:border-box}
#wise-app{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--paper:#fff;--bg:#f6f7f9;
--accent:#d97706;--accent-soft:#fffbeb;
--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
color:var(--ink);background:var(--bg);line-height:1.65;font-size:16px;
padding:18px;max-width:1040px;margin:0 auto;-webkit-text-size-adjust:100%}
#wise-app h1,#wise-app h2,#wise-app h3{margin:0;font-weight:700;line-height:1.3;letter-spacing:-.01em}
#wise-app .hd{background:var(--accent);color:#fff;border-radius:18px;padding:20px 22px;margin-bottom:16px;
box-shadow:var(--shadow);position:relative;overflow:hidden}
#wise-app .hd::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;
border-radius:50%;background:rgba(255,255,255,.10)}
#wise-app .hd h1{font-size:23px}
#wise-app .hd p{margin:6px 0 0;font-size:14px;opacity:.94}
#wise-app .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;
margin-bottom:14px;box-shadow:var(--shadow)}
#wise-app .card h2{font-size:18px;margin-bottom:10px}
#wise-app .card h3{font-size:16px}
#wise-app .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#wise-app label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px;font-weight:600}
#wise-app input,#wise-app textarea,#wise-app select{
width:100%;font:inherit;font-size:18px;padding:13px 14px;border:1px solid var(--line);
border-radius:12px;background:#fff;color:var(--ink)}
#wise-app input:focus,#wise-app textarea:focus,#wise-app select:focus{
outline:3px solid var(--accent-soft);border-color:var(--accent)}
#wise-app textarea{min-height:104px;resize:vertical}
#wise-app button{font:inherit;font-size:16px;font-weight:600;min-height:48px;padding:12px 18px;
border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
#wise-app button.ghost{background:#fff;color:var(--accent)}
#wise-app button.plain{background:#fff;color:var(--muted);border-color:var(--line)}
#wise-app button:disabled{opacity:.45;cursor:not-allowed}
#wise-app .code{font-size:38px;font-weight:800;letter-spacing:.16em;color:var(--accent)}
#wise-app .muted{color:var(--muted);font-size:14px}
#wise-app .pill{display:inline-block;padding:5px 11px;border-radius:999px;background:var(--accent-soft);
color:var(--accent);font-size:13px;font-weight:700}
#wise-app .tag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--bg);
border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;margin-right:4px}
#wise-app .hide{display:none}
#wise-app .bucket{border:2px dashed var(--line);border-radius:14px;padding:12px;min-height:120px;background:#fff}
#wise-app .bucket h3{font-size:15px;margin-bottom:8px}
#wise-app .grid{display:grid;gap:12px}
#wise-app .g2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
#wise-app .chip{display:block;width:100%;text-align:left;padding:13px 15px;margin-bottom:8px;
border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:600;min-height:48px}
#wise-app .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
#wise-app .bar{height:14px;border-radius:8px;background:var(--line);overflow:hidden}
#wise-app .bar>i{display:block;height:100%;background:var(--accent)}
#wise-app .steps{display:flex;gap:6px;margin:12px 0 0}
#wise-app .steps>span{flex:1;height:8px;border-radius:6px;background:var(--line)}
#wise-app .steps>span.on{background:var(--accent)}
#wise-app table{width:100%;border-collapse:collapse;font-size:14px}
#wise-app th,#wise-app td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
#wise-app th{background:var(--bg);font-weight:700}
#wise-app .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
#wise-app .safe{margin-top:14px;padding:13px 15px;border-radius:12px;background:#fff7ed;
border:1px solid #fed7aa;color:#9a3412;font-size:14px}
#wise-app .note{padding:12px 14px;border-radius:12px;background:var(--accent-soft);
color:var(--accent);font-size:14px;font-weight:600;margin-top:12px}
#wise-app .ok{color:#15803d;font-weight:700}
#wise-app .warn{color:#b45309;font-weight:700}
#wise-app .big{font-size:30px;font-weight:800;line-height:1.25}
#wise-app .foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 0}
#wise-app .wi{vertical-align:middle;margin-right:8px;flex:none}
#wise-app .ws-scene{display:block;width:100%;height:164px;border:2px solid var(--line);
border-radius:14px;background:#fff;margin:10px 0 6px}
#wise-app .iconrow{display:flex;align-items:center;gap:8px}
#wise-app .quest{display:none}
#wise-app .quest.on{display:block;animation:wfade .25s ease-out}
@keyframes wfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#wise-app .hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);
border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:700;font-size:14px;color:var(--accent)}
#wise-app .hud .grow{flex:1;min-width:120px}
#wise-app .hud .bar{background:#fff}
#wise-app .tile{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;
text-align:left;font-weight:700;min-height:112px;display:flex;flex-direction:column;gap:6px;
box-shadow:var(--shadow);color:var(--ink)}
#wise-app .tile small{font-weight:600;color:var(--muted);font-size:13px}
#wise-app .tile.done{border-color:var(--accent);background:var(--accent-soft)}
#wise-app .cele{position:fixed;inset:0;background:rgba(17,24,39,.55);display:flex;align-items:center;
justify-content:center;padding:20px;z-index:60}
#wise-app .cele .box{background:#fff;border-radius:22px;padding:26px;max-width:460px;width:100%;
text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.3)}
#wise-app .cele h2{font-size:24px;margin-bottom:10px}
#wise-app .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);
color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;z-index:70}
#wise-app canvas{max-width:100%;height:auto;border-radius:12px}
#wise-app .intro{margin:-4px 0 16px}
#wise-app .intro svg{display:block;width:100%;height:168px;border:2px solid var(--line);
border-radius:14px;background:#fff}
#wise-app .intro p{margin:10px 0 0;font-size:15px;color:var(--muted)}
#wise-app .intro b{color:var(--ink)}
#wise-app #present .card{border-radius:20px}
#wise-app #present table{font-size:19px}
#wise-app #present .big{font-size:44px}
@media (max-width:640px){#wise-app{padding:10px;font-size:15px}#wise-app .hd h1{font-size:19px}
#wise-app .g2{grid-template-columns:1fr}#wise-app .intro svg{height:126px}
#wise-app .ws-scene{height:120px}}
@media (prefers-reduced-motion:reduce){#wise-app *{transition:none!important;animation:none!important}}
</style>

<div class="hd">
  <h1>우리 반 AI 약속</h1>

<!-- 입장 -->

  <h2>들어가기</h2>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div>
      <label for="w-room">방 코드 6자리</label>
      <input id="w-room" inputmode="numeric" maxlength="6" placeholder="예: 482913">
    </div>
    <div>
      <label for="w-pw">비밀번호 4자리</label>
      <input id="w-pw" inputmode="numeric" maxlength="4" placeholder="예: 1234">
    </div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div>
      <label for="w-nick">닉네임</label>

      <span class="muted" id="w-sync">저장 준비됨</span>

<!-- 교사 -->

    <h2>선생님 화면</h2>

</div>

<script>
(function () {
  "use strict";

  var APP = "class-pledge";
  var DB = "https://remind-c2610-default-rtdb.firebaseio.com";
  var SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbyIqxbv5JObUl2eN7iSZ-HDcDcHtaKxHlEpuNfkfPQMmJUKrwIMnlUsqKH20OOeOs4/exec";
  var QUEUE_KEY = "wise_backup_queue";
  var LOCAL_KEY = "wise_" + APP + "_local";
  var ACCENT = "#d97706";
  var COPYRIGHT_LINE = "2026년 티처스랩 5기 교사연구회 A.N.D · CC BY-NC-SA";

  var $ = function (id) { return document.getElementById(id); };
  var me = { room: "", pw: "", nick: "", group: "", solo: false };
  var timer = null;
  var draftTimer = null;

  /* ---------- 저장 ---------- */

  function dbUrl(path) { return DB + "/wise/" + APP + "/" + path + ".json"; }

  function dbGet(path) {
    return fetch(dbUrl(path)).then(function (r) { return r.json(); });
  }
  function dbPut(path, data) {
    return fetch(dbUrl(path), {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).then(function (r) { return r.json(); });
  }
  function dbPush(path, data) {
    return fetch(dbUrl(path), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).then(function (r) { return r.json(); });
  }

  function sheetBackup(record) {
    try {
      var q = JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
      q.push(record);
      localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
      if (SHEET_ENDPOINT.indexOf("http") !== 0) { return; }
      fetch(SHEET_ENDPOINT, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ rows: q })
      }).then(function () {
        localStorage.setItem(QUEUE_KEY, "[]");
      })["catch"](function () {});
    } catch (e) {}
  }

  /* ---------- 도구 ---------- */

  function onlyDigits(s, n) {
    var out = "";
    for (var i = 0; i < s.length && out.length < n; i++) {
      if (s.charAt(i) >= "0" && s.charAt(i) <= "9") { out += s.charAt(i); }
    }
    return out;
  }

  function makeCode() {
    var s = "";
    for (var i = 0; i < 6; i++) { s += String(Math.floor(Math.random() * 10)); }
    return s;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }

  function barHtml(a, b) {
    return '<div class="bar"><i style="width:' + pct(a, b) + '%"></i></div>';
  }

  function show(id) {
    var ids = ["gate", "stage", "teacher", "present"];
    for (var i = 0; i < ids.length; i++) {
      $(ids[i]).className = ids[i] === id ? "" : "hide";
    }
  }

  /* 활동 화면이 부르는 골격 기능 */

  function wiseDraft(obj) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(obj)); } catch (e) {}
    $("w-sync").textContent = "이 기기에 임시 저장됨";
  }

  function wiseStep(i, n) {
    var h = "";
    for (var k = 0; k < n; k++) { h += '<span class="' + (k <= i ? "on" : "") + '"></span>'; }
    $("w-steps").innerHTML = h;
    $("w-steps").className = "steps";
  }

  /* 여정 화면 전환. 활동이 만든 .quest 조각을 갈아 끼운다. */
  function wiseGo(id) {
    var qs = document.querySelectorAll("#activity .quest");
    for (var i = 0; i < qs.length; i++) {
      qs[i].className = "quest" + (qs[i].getAttribute("data-q") === id ? " on" : "");
    }
    if (window.scrollTo) { window.scrollTo(0, 0); }
    if (typeof activityEnter === "function") {
      try { activityEnter(id); } catch (e) {}
    }
  }

  /* 상단 진행 표시. 여러 칸을 한 줄로 보여 준다. */
  function wiseHud(items) {
    var h = "";
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      h += '<span>' + esc(it.label) + ' ' + it.done + ' / ' + it.total + '</span>';
    }
    var first = items[0] || { done: 0, total: 1 };
    h += '<span class="grow">' + barHtml(first.done, first.total) + '</span>';
    $("w-hud").innerHTML = h;
    $("w-hud").className = "hud";
  }

  function wiseToast(text) {
    $("w-toast").textContent = text;
    $("w-toast").className = "toast";
    setTimeout(function () { $("w-toast").className = "toast hide"; }, 2200);
  }

  function wiseCelebrate(title, lines, buttonText) {
    var h = '<div class="box"><h2>' + esc(title) + '</h2>';
    for (var i = 0; i < lines.length; i++) {
      h += '<p class="muted" style="margin-top:6px">' + lines[i] + '</p>';
    }
    h += '<div class="row" style="justify-content:center;margin-top:16px">' +
      '<button type="button" id="cele-close">' + esc(buttonText || "닫기") + '</button></div></div>';
    $("w-cele").innerHTML = h;
    $("w-cele").className = "cele";
    $("cele-close").onclick = function () { $("w-cele").className = "cele hide"; };
  }

  /* 결과 카드를 그림으로 만들어 내려받는다. 교실에서 인쇄해 붙일 수 있다. */
  function wiseCardPng(title, lines, filename) {
    try {
      var c = document.createElement("canvas");
      c.width = 900; c.height = 560;
      var g = c.getContext("2d");
      g.fillStyle = "#ffffff"; g.fillRect(0, 0, 900, 560);
      g.fillStyle = ACCENT; g.fillRect(0, 0, 900, 120);
      g.fillStyle = "#ffffff"; g.font = "bold 40px sans-serif";
      g.fillText(title, 40, 76);
      g.fillStyle = "#111827"; g.font = "26px sans-serif";
      for (var i = 0; i < lines.length && i < 10; i++) {
        g.fillText(String(lines[i]).slice(0, 34), 40, 180 + i * 42);
      }
      g.fillStyle = "#6b7280"; g.font = "18px sans-serif";
      g.fillText(COPYRIGHT_LINE, 40, 530);
      var a = document.createElement("a");
      a.href = c.toDataURL("image/png");
      a.download = (filename || "wise_card") + ".png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      wiseToast("카드를 내려받았어요.");
    } catch (e) { wiseToast("이 기기에서는 카드 저장이 안 돼요."); }
  }

  /* 교사 화면용 막대 그림. 캔버스로 그린다. */
  function wiseBars(rows, width) {
    var w = width || 620, h = 42 * rows.length + 24;
    var c = document.createElement("canvas");
    if (!c || typeof c.getContext !== "function") { return barTable(rows); }
    c.width = w; c.height = h;
    var g = c.getContext("2d");
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h);
    var max = 1;
    for (var i = 0; i < rows.length; i++) { if (rows[i].value > max) { max = rows[i].value; } }
    for (var k = 0; k < rows.length; k++) {
      var y = 16 + k * 42;
      g.fillStyle = "#374151"; g.font = "bold 16px sans-serif";
      g.fillText(String(rows[k].label).slice(0, 14), 8, y + 20);
      var x0 = 160, bw = (w - 200) * rows[k].value / max;
      g.fillStyle = "#e5e7eb"; g.fillRect(x0, y, w - 200, 24);
      g.fillStyle = rows[k].color || ACCENT; g.fillRect(x0, y, bw, 24);
      g.fillStyle = "#111827"; g.font = "bold 15px sans-serif";
      g.fillText(String(rows[k].value), x0 + bw + 8, y + 18);
    }
    return '<img alt="분포 그림" style="width:100%" src="' + c.toDataURL("image/png") + '">';
  }

  /* 캔버스를 못 쓰는 자리에서는 표로 대신한다. */
  function barTable(rows) {
    var h = '<div class="scroll"><table><tr><th>항목</th><th>수</th><th>분포</th></tr>';
    var max = 1;
    for (var i = 0; i < rows.length; i++) { if (rows[i].value > max) { max = rows[i].value; } }
    for (var k = 0; k < rows.length; k++) {
      h += "<tr><td>" + esc(rows[k].label) + "</td><td>" + rows[k].value + "</td><td>" +
        barHtml(rows[k].value, max) + "</td></tr>";
    }
    return h + "</table></div>";
  }

  function wiseNote(text) {
    if (!text) { $("w-note").className = "note hide"; return; }
    $("w-note").innerHTML = text;
    $("w-note").className = "note";
  }

  /* ---------- 활동 (차시별) ---------- */


  /* ---------- 기준과 틀 ---------- */

  var CRITERIA = ["① 교육목적 정합성", "② 학습자 주체성", "③ 교사의 전문적 행위주체성", "④ 인간 중심성과 역할 경계", "⑤ 비판적 AI 리터러시와 검증 가능성", "⑥ 윤리·책임성", "⑦ 디지털 웰빙과 심리·정서적 안전", "⑧ 맥락 적합성과 형평성"];

  var BAN_WORDS = ["하지 마", "하지말", "금지", "안 된다", "안된다", "쓰지 마", "쓰지말", "절대"];

  var FRAMES = [
    "___ 할 때는 ___ 하면 된다",
    "먼저 ___ 하고 나서 ___ 에 도움을 받는다",
    "___ 인 경우에는 ___ 를 반드시 확인한다",
    "___ 는 사람이 정하고 ___ 만 맡긴다"
  ];

  var st = { votes: {}, list: [], merged: [] };

  /* ---------- 화면 ---------- */

  function activityHtml() {
    var h = '<div class="card"><h2>1. 우리 모둠이 맡은 기준</h2>' +
      '<label for="crit">기준 고르기</label><select id="crit">';
    for (var i = 0; i < CRITERIA.length; i++) {
      h += '<option value="' + i + '">' + esc(CRITERIA[i]) + '</option>';
    }
    h += '</select><label for="mean">우리 말로 바꾼 뜻</label>' +
      '<input id="mean" maxlength="80" placeholder="예: 내 생각을 먼저 만들라는 뜻"></div>';

    h += '<div class="card"><h2>2. 약속 문장 쓰기</h2>' +
      '<p class="muted">틀을 눌러 보면 조건형 문장으로 시작할 수 있어요.</p><div class="row">';
    for (var f = 0; f < FRAMES.length; f++) {
      h += '<button type="button" class="chip frame" data-f="' + f +
        '" style="width:auto;margin:0;font-size:14px">' + esc(FRAMES[f]) + '</button>';
    }
    h += '</div><label for="claus">우리 반이 지킬 약속 문장</label>' +
      '<textarea id="claus" maxlength="200" placeholder="하지 마라 대신 어떤 조건이면 되는지로 써요"></textarea>' +
      '<div id="checkmsg" style="margin-top:8px"></div>' +
      '<div class="row" style="margin-top:8px">' +
      '<button type="button" id="check" class="ghost">문장 점검하기</button></div></div>';

    h += '<div class="card"><h2>3. 제안된 약속에 투표하기</h2>' +
      '<p class="muted">한 사람이 3표까지 쓸 수 있어요. 우리 모둠 것에만 몰아 주지 않아요.</p>' +
      '<div class="row"><button type="button" id="reload" class="ghost">목록 새로고침</button>' +
      '<span class="pill" id="left">남은 표 3</span></div>' +
      '<div id="plist" style="margin-top:12px"></div></div>';

    h += '<div class="card"><h2>4. 비슷한 약속 묶기</h2>' +
      '<label for="merge">묶어서 하나로 만들면 좋을 약속</label>' +
      '<textarea id="merge" maxlength="200" placeholder="예: 3모둠과 5모둠 약속을 합치면 좋겠습니다"></textarea></div>';

    h += '<div class="safe">이름, 사진, 친구 이야기 같은 개인정보는 넣지 않아요.</div>';
    return h;
  }

  /* ---------- 문장 점검 ---------- */

  function checkClause(text) {
    var found = [];
    for (var i = 0; i < BAN_WORDS.length; i++) {
      if (text.indexOf(BAN_WORDS[i]) >= 0) { found.push(BAN_WORDS[i]); }
    }
    var hasCond = text.indexOf("면") >= 0 || text.indexOf("때") >= 0 || text.indexOf("경우") >= 0;
    return { ban: found, cond: hasCond, len: text.length };
  }

  function paintCheck() {
    var text = $("claus") ? $("claus").value.trim() : "";
    if (!text) { $("checkmsg").innerHTML = '<p class="muted">문장을 쓰고 점검해 봐요.</p>'; return; }
    var r = checkClause(text);
    var h = "";
    if (r.ban.length) {
      h += '<p class="warn">금지하는 말이 들어 있어요 : ' + esc(r.ban.join(", ")) + '</p>' +
        '<p class="muted">"쓰지 마" 대신 "어떤 조건이면 써도 된다"로 바꾸어 봐요.</p>';
    }
    if (!r.cond) {
      h += '<p class="warn">조건이 보이지 않아요. 언제, 어떤 경우인지 넣어 봐요.</p>';
    }
    if (!r.ban.length && r.cond) {
      h += '<p class="ok">조건형 문장이에요. 우리 반 기준이 될 수 있어요.</p>';
    }
    $("checkmsg").innerHTML = h;
  }

  /* ---------- 제안 목록과 투표 ---------- */

  function voteLeft() {
    var used = 0;
    for (var k in st.votes) { if (st.votes.hasOwnProperty(k)) { used++; } }
    return 3 - used;
  }

  function reload() {
    if (me.solo) {
      $("plist").innerHTML = '<p class="muted">혼자 체험 중에는 목록이 없어요. 문장 쓰기까지 해 봐요.</p>';
      return;
    }
    dbGet(me.room + "/entries").then(function (data) {
      st.list = [];
      for (var k in data) {
        if (!data.hasOwnProperty(k)) { continue; }
        var p = data[k].payload;
        if (p && p.clause) { st.list.push({ key: k, nick: data[k].nick, group: data[k].group, p: p }); }
      }
      render();
    })["catch"](function () {
      $("plist").innerHTML = '<p class="warn">지금은 목록을 불러올 수 없어요.</p>';
    });
  }

  function render() {
    if (!st.list.length) {
      $("plist").innerHTML = '<p class="muted">아직 제안이 없어요. 먼저 제출해 봐요.</p>';
      return;
    }
    var h = "";
    for (var i = 0; i < st.list.length; i++) {
      var it = st.list[i];
      var r = checkClause(it.p.clause);
      h += '<div class="card" style="margin-bottom:8px"><span class="pill">' +
        esc(CRITERIA[it.p.crit] || "") + '</span> ' +
        (r.ban.length ? wiseIcon("red", 22) + '<span class="tag">금지형</span>'
          : wiseIcon("check", 22) + '<span class="tag">조건형</span>') +
        '<p style="margin:8px 0;font-size:17px">' + esc(it.p.clause) + '</p>' +
        '<p class="muted">' + esc(it.group || "") + '</p>' +
        '<button type="button" class="chip vote" data-k="' + esc(it.key) +
        '" style="width:auto">' + (st.votes[it.key] ? "찬성했어요" : "이 약속에 찬성") + '</button></div>';
    }
    $("plist").innerHTML = h;
    $("left").textContent = "남은 표 " + voteLeft();
    var vs = document.querySelectorAll("#activity .vote");
    for (var j = 0; j < vs.length; j++) {
      vs[j].onclick = function () {
        var key = this.getAttribute("data-k");
        if (st.votes[key]) { return; }
        if (voteLeft() <= 0) {
          wiseNote("표를 모두 썼어요. 생각이 바뀌면 다음 라운드에 다시 정해요.");
          return;
        }
        st.votes[key] = true;
        dbPush(me.room + "/votes", { key: key, nick: me.nick, at: Date.now() })["catch"](function () {});
        this.textContent = "찬성했어요";
        this.className = "chip vote on";
        $("left").textContent = "남은 표 " + voteLeft();
      };
    }
  }

  /* ---------- 흐름 ---------- */

  function activityInit(saved) {
    if (saved) {
      if (saved.crit !== undefined && $("crit")) { $("crit").value = saved.crit; }
      if (saved.mean && $("mean")) { $("mean").value = saved.mean; }
      if (saved.clause && $("claus")) { $("claus").value = saved.clause; }
      if (saved.merge && $("merge")) { $("merge").value = saved.merge; }
    }
    var fs = document.querySelectorAll("#activity .frame");
    for (var i = 0; i < fs.length; i++) {
      fs[i].onclick = function () {
        var f = FRAMES[Number(this.getAttribute("data-f"))];
        if ($("claus") && !$("claus").value.trim()) { $("claus").value = f; }
        paintCheck();
      };
    }
    $("check").onclick = paintCheck;
    $("reload").onclick = reload;
    wiseStep(0, 4);
    wiseNote("금지가 아니라 조건으로 쓰는 것이 우리 반의 방식이에요.");
    paintCheck();
    reload();
  }

  function val(id) { return $(id) ? $(id).value.trim() : ""; }

  function activityDraft() {
    return { crit: Number(val("crit") || 0), mean: val("mean"), clause: val("claus"), merge: val("merge") };
  }

  function activityAutofill() {
    if ($("claus")) { $("claus").value = "숙제를 할 때는 내 생각을 먼저 쓰고 나서 AI에게 물어보면 된다"; }
    if ($("mean")) { $("mean").value = "내 생각을 먼저 만들라는 뜻"; }
    if ($("crit")) { $("crit").value = "0"; }
  }

  function activityCollect() {
    var clause = val("claus");
    if (clause.length < 8) {
      $("w-msg").innerHTML = '<span class="warn">약속 문장을 조금 더 자세히 써 주세요.</span>';
      return null;
    }
    var r = checkClause(clause);
    if (r.ban.length && !r.cond) {
      $("w-msg").innerHTML = '<span class="warn">금지하는 말만 있어요. 어떤 조건이면 되는지도 넣어 주세요.</span>';
      return null;
    }
    return {
      crit: Number(val("crit") || 0), mean: val("mean"), clause: clause,
      merge: val("merge"), style: r.ban.length ? "금지형" : "조건형"
    };
  }

  /* ---------- 교사 화면 ---------- */

  function teacherSummary(list) {
    var cond = 0, ban = 0;
    for (var i = 0; i < list.length; i++) {
      var p = list[i].payload || {};
      if (!p.clause) { continue; }
      if (p.style === "조건형") { cond++; } else { ban++; }
    }
    var h = '<p class="muted">조건형 ' + cond + '개 · 금지형 ' + ban + '개</p>' + barHtml(cond, cond + ban);
    h += '<div class="scroll" style="margin-top:12px"><table><tr><th>기준</th><th>약속 문장</th>' +
      '<th>모둠</th><th>형태</th></tr>';
    for (var k = 0; k < list.length; k++) {
      var q = list[k].payload || {};
      if (!q.clause) { continue; }
      h += "<tr><td>" + esc(CRITERIA[q.crit] || "") + "</td><td>" + esc(q.clause) + "</td><td>" +
        esc(list[k].group || list[k].nick) + "</td><td>" +
        (q.style === "조건형" ? '<span class="ok">조건형</span>' : '<span class="warn">금지형</span>') +
        "</td></tr>";
    }
    h += "</table></div>";
    h += '<p class="muted" style="margin-top:10px">투표 결과는 발표 모드에서 크게 볼 수 있습니다. ' +
      '금지형 문장은 조건형으로 함께 고쳐 봅니다.</p>';
    return h;
  }

  function presentHtml(list) {
    var h = '<p class="muted">우리 반이 제안한 약속이에요. 조건형 문장부터 읽어 봐요.</p>';
    var conds = [], bans = [];
    for (var i = 0; i < list.length; i++) {
      var p = list[i].payload || {};
      if (!p.clause) { continue; }
      (p.style === "조건형" ? conds : bans).push(p);
    }
    for (var k = 0; k < conds.length; k++) {
      h += '<p style="font-size:24px;margin:10px 0">' + esc(conds[k].clause) + '</p>';
    }
    if (bans.length) {
      h += '<h3 style="margin-top:16px">조건형으로 함께 고칠 문장</h3>';
      for (var b = 0; b < bans.length; b++) {
        h += '<p style="font-size:20px;margin:8px 0" class="warn">' + esc(bans[b].clause) + '</p>';
      }
    }
    return h;
  }

      inner = '<rect width="320" height="120" fill="#F6F7F9"/>' +
        '<rect x="16" y="26" width="120" height="68" rx="14" fill="#fff" stroke="' + ink + '" stroke-width="3"/>' +
        '<text x="76" y="58" font-size="14" font-weight="800" text-anchor="middle">방 코드</text>' +
        '<text x="76" y="80" font-size="20" font-weight="900" text-anchor="middle" fill="#2B59E0">482913</text>' +
        '<path d="M144 60h28" stroke="' + ink + '" stroke-width="4" stroke-linecap="round"/>' +
        '<path d="M166 52l10 8-10 8z" fill="' + ink + '"/>' +
        '<circle cx="212" cy="48" r="14" fill="#00D45A" stroke="' + ink + '" stroke-width="3"/>' +
        '<path d="M192 94c0-12 9-18 20-18s20 6 20 18z" fill="#00D45A" stroke="' + ink + '" stroke-width="3"/>' +
        '<circle cx="272" cy="48" r="14" fill="#FFE24B" stroke="' + ink + '" stroke-width="3"/>' +
        '<path d="M252 94c0-12 9-18 20-18s20 6 20 18z" fill="#FFE24B" stroke="' + ink + '" stroke-width="3"/>';
    } else {
      inner = '<rect width="320" height="120" fill="#F6F7F9"/>';
    }
    var vb = kind === "axis" ? "0 0 320 150" : "0 0 320 120";
    return '<svg class="ws-scene" viewBox="' + vb + '" aria-hidden="true">' + inner + '</svg>';
  }


  function activityIntro() {
    return "<svg class=\"art\" viewBox=\"0 0 320 180\" role=\"img\" aria-hidden=\"true\" preserveAspectRatio=\"xMidYMid slice\"><rect width=\"320\" height=\"180\" fill=\"#F4EEE0\"/><rect x=\"26\" y=\"22\" width=\"150\" height=\"136\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#111111\" stroke-width=\"3\"/><text x=\"44\" y=\"52\" font-size=\"17\" font-weight=\"900\" fill=\"#111111\">우리 반 약속</text><circle cx=\"48\" cy=\"70\" r=\"6\" fill=\"#00D45A\" stroke=\"#111111\" stroke-width=\"2.5\"/><path d=\"M62 70 h96\" stroke=\"#111111\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"48\" cy=\"92\" r=\"6\" fill=\"#00D45A\" stroke=\"#111111\" stroke-width=\"2.5\"/><path d=\"M62 92 h96\" stroke=\"#111111\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"48\" cy=\"114\" r=\"6\" fill=\"#00D45A\" stroke=\"#111111\" stroke-width=\"2.5\"/><path d=\"M62 114 h96\" stroke=\"#111111\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"48\" cy=\"136\" r=\"6\" fill=\"#00D45A\" stroke=\"#111111\" stroke-width=\"2.5\"/><path d=\"M62 136 h96\" stroke=\"#111111\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M212 108 v-34 a8 8 0 0 1 16 0 v34z\" fill=\"#00D45A\" stroke=\"#111111\" stroke-width=\"3\" stroke-linejoin=\"round\"/><rect x=\"208\" y=\"106\" width=\"24\" height=\"26\" rx=\"8\" fill=\"#00D45A\" stroke=\"#111111\" stroke-width=\"3\"/><path d=\"M250 96 v-34 a8 8 0 0 1 16 0 v34z\" fill=\"#2B59E0\" stroke=\"#111111\" stroke-width=\"3\" stroke-linejoin=\"round\"/><rect x=\"246\" y=\"94\" width=\"24\" height=\"26\" rx=\"8\" fill=\"#2B59E0\" stroke=\"#111111\" stroke-width=\"3\"/><path d=\"M288 112 v-34 a8 8 0 0 1 16 0 v34z\" fill=\"#7B4FE8\" stroke=\"#111111\" stroke-width=\"3\" stroke-linejoin=\"round\"/><rect x=\"284\" y=\"110\" width=\"24\" height=\"26\" rx=\"8\" fill=\"#7B4FE8\" stroke=\"#111111\" stroke-width=\"3\"/></svg><p><b>7차시 · 우리 반 AI 약속</b><br>8가지 기준별로 모둠이 조항을 제안하고, 학급이 투표해 우리 반 AI 약속 8조항을 확정한다. 방 코드가 없으면 혼자 체험해 보기로 눌러 봐요.</p>";
  }


  /* ---------- 학생 흐름 ---------- */

  function enter(solo) {
    var room = onlyDigits($("w-room").value, 6);
    var pw = onlyDigits($("w-pw").value, 4);
    var nick = $("w-nick").value.trim();
    var group = $("w-group").value.trim();

    if (!nick) { $("w-gate-msg").textContent = "닉네임을 써 주세요."; return; }
    if (!solo && room.length !== 6) { $("w-gate-msg").textContent = "방 코드 6자리를 정확히 써 주세요."; return; }

    me = { room: solo ? "solo" : room, pw: pw, nick: nick, group: group, solo: !!solo };
    $("w-who").textContent = me.nick + (me.group ? " · " + me.group : "") +
      (me.solo ? " · 혼자 체험" : " · " + me.room);
    $("activity").innerHTML = activityHtml();
    activityInit(loadLocal());
    startDraft();
    show("stage");
  }

  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "null"); }
    catch (e) { return null; }
  }

  function startDraft() {
    if (draftTimer) { clearInterval(draftTimer); }
    if (typeof activityDraft !== "function") { return; }
    draftTimer = setInterval(function () {
      try {
        var d = activityDraft();
        if (d) { wiseDraft(d); }
      } catch (e) {}
    }, 8000);
  }

  function submit() {
    var payload = activityCollect();
    if (payload === null) { return; }

    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(payload)); } catch (e) {}

    if (me.solo) {
      $("w-msg").innerHTML = '<span class="ok">이 기기에만 저장했어요. 혼자 체험 중이에요.</span>';
      return;
    }

    var record = {
      nick: me.nick, group: me.group, app: APP,
      room: me.room, at: Date.now(), payload: payload
    };

    $("w-sync").textContent = "저장 중...";
    dbPush(me.room + "/entries", record).then(function () {
      $("w-sync").textContent = "저장됨";
      $("w-msg").innerHTML = '<span class="ok">제출했어요. 고쳐서 다시 제출해도 괜찮아요.</span>';
      sheetBackup(record);
    })["catch"](function () {
      $("w-sync").textContent = "저장 실패";
      $("w-msg").innerHTML = '<span class="warn">인터넷이 불안정해요. 쓴 내용은 이 기기에 남아 있어요. 잠시 뒤 다시 제출해 주세요.</span>';
    });
  }

  /* ---------- 교사 흐름 ---------- */

  function teacherMake() {
    var code = makeCode();
    var pw = onlyDigits($("w-pw").value, 4) || "0000";
    dbPut(code + "/meta", { app: APP, pw: pw, at: Date.now(), locked: false })
      .then(function () { teacherOpen(code, pw); })
      ["catch"](function () { alert("방을 만들지 못했어요. 인터넷을 확인해 주세요."); });
  }

  function teacherOpen(code, pw) {
    me.room = code;
    $("t-code").textContent = code;
    $("t-pw").textContent = "비밀번호 " + (pw || "-") + " · 이 화면을 닫아도 방은 사라지지 않아요.";
    $("t-room").className = "";
    $("t-board").className = "card";
    teacherRefresh();
    if (timer) { clearInterval(timer); }
    timer = setInterval(teacherRefresh, 3000);
  }

  function teacherRefresh() {
    if (!me.room) { return; }
    dbGet(me.room + "/entries").then(function (data) {
      var rows = [];
      for (var k in data) { if (data.hasOwnProperty(k)) { rows.push(data[k]); } }
      rows.sort(function (a, b) { return (a.at || 0) - (b.at || 0); });

      var latest = {};
      for (var i = 0; i < rows.length; i++) { latest[rows[i].nick] = rows[i]; }
      var list = [];
      for (var n in latest) { if (latest.hasOwnProperty(n)) { list.push(latest[n]); } }

      $("t-count").textContent = list.length + "명";
      $("t-note").textContent = noteFor(list, rows.length);
      $("t-summary").innerHTML = teacherSummary(list);
      $("t-table").innerHTML = teacherTable(list);
      window.__wiseRows = list;
      if ($("present").className === "") { paintPresent(list); }
    })["catch"](function () {});
  }

  function noteFor(list, tries) {
    if (!list.length) { return "아직 제출이 없어요. 학생에게 방 코드를 알려 주세요."; }
    var groups = {}, n = 0;
    for (var i = 0; i < list.length; i++) {
      var g = list[i].group || "모둠 없음";
      if (!groups[g]) { groups[g] = 0; n++; }
      groups[g] += 1;
    }
    var last = 0;
    for (var k = 0; k < list.length; k++) { if (list[k].at > last) { last = list[k].at; } }
    return "모둠 " + n + "개 · 제출 시도 " + tries + "회 · 마지막 제출 " +
      new Date(last).toLocaleTimeString("ko-KR");
  }

  function paintPresent(list) {
    var html = "";
    try {
      html = (typeof presentHtml === "function") ? presentHtml(list) : teacherSummary(list);
    } catch (e) { html = teacherSummary(list); }
    $("p-title").textContent = "우리 반 결과 · " + list.length + "명";
    $("p-body").innerHTML = html;
  }

  function teacherTable(list) {
    var h = "<tr><th>닉네임</th><th>모둠</th><th>제출 시각</th><th>내용</th></tr>";
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      h += "<tr><td>" + esc(r.nick) + "</td><td>" + esc(r.group) + "</td><td>" +
        new Date(r.at).toLocaleTimeString("ko-KR") + "</td><td>" +
        esc(JSON.stringify(r.payload).slice(0, 180)) + "</td></tr>";
    }
    return h;
  }

  function toCsv(list) {
    var lines = ["닉네임,모둠,제출시각,내용"];
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      lines.push([r.nick, r.group, new Date(r.at).toLocaleString("ko-KR"),
        JSON.stringify(r.payload)].map(function (v) {
          return '"' + String(v).split('"').join('""') + '"';
        }).join(","));
    }
    return lines.join("\n");
  }

  function download() {
    var list = window.__wiseRows || [];
    var blob = new Blob(["\ufeff" + toCsv(list)], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = APP + "_" + me.room + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  /* ---------- 연결 ---------- */

  $("w-enter").onclick = function () { enter(false); };
  $("w-solo").onclick = function () { enter(true); };
  $("w-teacher").onclick = function () { show("teacher"); };
  $("w-submit").onclick = submit;
  $("w-leave").onclick = function () {
    if (timer) { clearInterval(timer); }
    if (draftTimer) { clearInterval(draftTimer); }
    show("gate");
  };

  $("t-make").onclick = teacherMake;
  $("t-open").onclick = function () {
    var code = onlyDigits(prompt("방 코드 6자리를 넣어 주세요.") || "", 6);
    if (code.length === 6) { teacherOpen(code, ""); }
  };
  $("t-back").onclick = function () { if (timer) { clearInterval(timer); } show("gate"); };
  $("t-refresh").onclick = teacherRefresh;
  $("t-csv").onclick = download;
  $("t-detail").onclick = function () {
    var open = $("t-wrap").className.indexOf("hide") < 0;
    $("t-wrap").className = open ? "scroll hide" : "scroll";
    this.textContent = open ? "낱낱이 보기 켜기" : "낱낱이 보기 끄기";
  };
  $("t-present").onclick = function () {
    paintPresent(window.__wiseRows || []);
    show("present");
  };
  $("p-close").onclick = function () { show("teacher"); };
  $("t-lock").onclick = function () {
    dbPut(me.room + "/meta/locked", true).then(function () { alert("방을 잠갔어요."); });
  };
  $("t-copy").onclick = function () {
    var code = $("t-code").textContent;
    var done = function () { $("t-copy").textContent = "복사됨";
      setTimeout(function () { $("t-copy").textContent = "복사"; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done)["catch"](function () { fallbackCopy(code, done); });
    } else { fallbackCopy(code, done); }
  };

  /* 입장 화면에 이 활동을 소개하는 그림을 깐다. 혼자 열어 본 학생을 위한 것이다. */
  if (typeof activityIntro === "function") {
    try {
      $("w-intro").innerHTML = activityIntro();
      $("w-intro").className = "intro";
    } catch (e) {}
  }

  /* 자동 검사용 통로. 수업 화면에는 영향이 없다. */
  if (typeof window !== "undefined") {
    window.__wiseTest = {
      app: APP,
      activityHtml: activityHtml,
      activityInit: activityInit,
      activityCollect: activityCollect,
      teacherSummary: teacherSummary,
      presentHtml: (typeof presentHtml === "function") ? presentHtml : null,
      activityAutofill: (typeof activityAutofill === "function") ? activityAutofill : null,
      setMe: function (v) { me = v; }
    };
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { alert(text); }
    document.body.removeChild(ta);
  }
})();
</script>
