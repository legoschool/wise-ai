<meta charset="utf-8">
<div id="wise-app">
<style>
#wise-app *,#wise-app *::before,#wise-app *::after{box-sizing:border-box}
#wise-app{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--paper:#fff;--bg:#f6f7f9;
--accent:#059669;--accent-soft:#ecfdf5;
--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
color:var(--ink);background:var(--bg);line-height:1.65;font-size:16px;
padding:18px;max-width:1040px;margin:0 auto;-webkit-text-size-adjust:100%}
#wise-app h1,#wise-app h2,#wise-app h3{margin:0;font-weight:700;line-height:1.3;letter-spacing:-.01em}
#wise-app .hd{background:var(--accent);color:#fff;border-radius:18px;padding:20px 22px;margin-bottom:16px;
box-shadow:var(--shadow);position:relative;overflow:hidden}
#wise-app .hd::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;
border-radius:50%;background:rgba(255,255,255,.10)}
#wise-app .hd h1{font-size:23px}
#wise-app .hd p{margin:6px 0 0;font-size:14px;opacity:.94}
#wise-app .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;
margin-bottom:14px;box-shadow:var(--shadow)}
#wise-app .card h2{font-size:18px;margin-bottom:10px}
#wise-app .card h3{font-size:16px}
#wise-app .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#wise-app label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px;font-weight:600}
#wise-app input,#wise-app textarea,#wise-app select{
width:100%;font:inherit;font-size:18px;padding:13px 14px;border:1px solid var(--line);
border-radius:12px;background:#fff;color:var(--ink)}
#wise-app input:focus,#wise-app textarea:focus,#wise-app select:focus{
outline:3px solid var(--accent-soft);border-color:var(--accent)}
#wise-app textarea{min-height:104px;resize:vertical}
#wise-app button{font:inherit;font-size:16px;font-weight:600;min-height:48px;padding:12px 18px;
border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
#wise-app button.ghost{background:#fff;color:var(--accent)}
#wise-app button.plain{background:#fff;color:var(--muted);border-color:var(--line)}
#wise-app button:disabled{opacity:.45;cursor:not-allowed}
#wise-app .code{font-size:38px;font-weight:800;letter-spacing:.16em;color:var(--accent)}
#wise-app .muted{color:var(--muted);font-size:14px}
#wise-app .pill{display:inline-block;padding:5px 11px;border-radius:999px;background:var(--accent-soft);
color:var(--accent);font-size:13px;font-weight:700}
#wise-app .tag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--bg);
border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;margin-right:4px}
#wise-app .hide{display:none}
#wise-app .bucket{border:2px dashed var(--line);border-radius:14px;padding:12px;min-height:120px;background:#fff}
#wise-app .bucket h3{font-size:15px;margin-bottom:8px}
#wise-app .grid{display:grid;gap:12px}
#wise-app .g2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
#wise-app .chip{display:block;width:100%;text-align:left;padding:13px 15px;margin-bottom:8px;
border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:600;min-height:48px}
#wise-app .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
#wise-app .bar{height:14px;border-radius:8px;background:var(--line);overflow:hidden}
#wise-app .bar>i{display:block;height:100%;background:var(--accent)}
#wise-app .steps{display:flex;gap:6px;margin:12px 0 0}
#wise-app .steps>span{flex:1;height:8px;border-radius:6px;background:var(--line)}
#wise-app .steps>span.on{background:var(--accent)}
#wise-app table{width:100%;border-collapse:collapse;font-size:14px}
#wise-app th,#wise-app td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
#wise-app th{background:var(--bg);font-weight:700}
#wise-app .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
#wise-app .safe{margin-top:14px;padding:13px 15px;border-radius:12px;background:#fff7ed;
border:1px solid #fed7aa;color:#9a3412;font-size:14px}
#wise-app .note{padding:12px 14px;border-radius:12px;background:var(--accent-soft);
color:var(--accent);font-size:14px;font-weight:600;margin-top:12px}
#wise-app .ok{color:#15803d;font-weight:700}
#wise-app .warn{color:#b45309;font-weight:700}
#wise-app .big{font-size:30px;font-weight:800;line-height:1.25}
#wise-app .foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 0}
#wise-app .wi{vertical-align:middle;margin-right:8px;flex:none}
#wise-app .ws-scene{display:block;width:100%;height:164px;border:2px solid var(--line);
border-radius:14px;background:#fff;margin:10px 0 6px}
#wise-app .iconrow{display:flex;align-items:center;gap:8px}
#wise-app .intro{margin:-4px 0 16px}
#wise-app .intro svg{display:block;width:100%;height:168px;border:2px solid var(--line);
border-radius:14px;background:#fff}
#wise-app .intro p{margin:10px 0 0;font-size:15px;color:var(--muted)}
#wise-app .intro b{color:var(--ink)}
#wise-app #present .card{border-radius:20px}
#wise-app #present table{font-size:19px}
#wise-app #present .big{font-size:44px}
@media (max-width:640px){#wise-app{padding:10px;font-size:15px}#wise-app .hd h1{font-size:19px}
#wise-app .g2{grid-template-columns:1fr}#wise-app .intro svg{height:126px}
#wise-app .ws-scene{height:120px}}
@media (prefers-reduced-motion:reduce){#wise-app *{transition:none!important;animation:none!important}}
</style>

<div class="hd">
  <h1>AI for Good 프로젝트 보드</h1>
  <p>11차시 · AI for Good 프로젝트(1)</p>
</div>

<!-- 입장 -->
<section id="gate" class="card">
  <div id="w-intro" class="hide"></div>
  <h2>들어가기</h2>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div>
      <label for="w-room">방 코드 6자리</label>
      <input id="w-room" inputmode="numeric" maxlength="6" placeholder="예: 482913">
    </div>
    <div>
      <label for="w-pw">비밀번호 4자리</label>
      <input id="w-pw" inputmode="numeric" maxlength="4" placeholder="예: 1234">
    </div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div>
      <label for="w-nick">닉네임</label>
      <input id="w-nick" maxlength="12" placeholder="이름 말고 별명을 써요">
    </div>
    <div>
      <label for="w-group">모둠</label>
      <input id="w-group" maxlength="10" placeholder="예: 3모둠">
    </div>
  </div>
  <div class="row" style="margin-top:14px">
    <button id="w-enter">입장하기</button>
    <button id="w-solo" class="ghost">혼자 체험해 보기</button>
    <button id="w-teacher" class="plain">선생님 화면</button>
  </div>
  <p id="w-gate-msg" class="muted" style="margin-top:10px"></p>
  <div class="safe">이름, 사진, 친구 이야기 같은 개인정보는 넣지 않아요.</div>
</section>

<!-- 학생 활동 -->
<section id="stage" class="hide">
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <span class="pill" id="w-who"></span>
      <span class="muted" id="w-sync">저장 준비됨</span>
    </div>
    <div class="steps hide" id="w-steps"></div>
    <div class="note hide" id="w-note"></div>
  </div>
  <div id="activity"></div>
  <div class="card">
    <button id="w-submit">제출하기</button>
    <button id="w-leave" class="plain">나가기</button>
    <p id="w-msg" class="muted" style="margin-top:10px"></p>
  </div>
</section>

<!-- 교사 -->
<section id="teacher" class="hide">
  <div class="card">
    <h2>선생님 화면</h2>
    <div class="row">
      <button id="t-make">새 방 만들기</button>
      <button id="t-open" class="ghost">기존 방 열기</button>
      <button id="t-back" class="plain">돌아가기</button>
    </div>
    <div id="t-room" class="hide" style="margin-top:16px">
      <p class="muted">방 코드</p>
      <div class="row">
        <span class="code" id="t-code">------</span>
        <button id="t-copy" class="ghost">복사</button>
      </div>
      <p class="muted" id="t-pw"></p>
      <div class="row" style="margin-top:12px">
        <button id="t-present">결과 크게 띄우기</button>
        <button id="t-refresh" class="ghost">새로고침</button>
        <button id="t-csv" class="ghost">CSV 내려받기</button>
        <button id="t-lock" class="plain">방 잠그기</button>
      </div>
    </div>
  </div>
  <div id="t-board" class="card hide">
    <h2>제출 현황 <span class="pill" id="t-count">0명</span></h2>
    <p class="muted" id="t-note"></p>
    <div id="t-summary"></div>
    <div class="row" style="margin-top:12px">
      <button id="t-detail" class="plain">낱낱이 보기 켜기</button>
    </div>
    <div class="scroll hide" id="t-wrap" style="margin-top:12px"><table id="t-table"></table></div>
  </div>
</section>

<!-- 발표 -->
<section id="present" class="hide">
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 id="p-title">우리 반 결과</h2>
      <button id="p-close" class="plain">닫기</button>
    </div>
    <div id="p-body" style="margin-top:12px"></div>
  </div>
</section>

<p class="foot">2026년 티처스랩 5기 교사연구회 A.N.D · CC BY-NC-SA</p>
</div>

<script>
(function () {
  "use strict";

  var APP = "good-project-board";
  var DB = "https://remind-c2610-default-rtdb.firebaseio.com";
  var SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbyIqxbv5JObUl2eN7iSZ-HDcDcHtaKxHlEpuNfkfPQMmJUKrwIMnlUsqKH20OOeOs4/exec";
  var QUEUE_KEY = "wise_backup_queue";
  var LOCAL_KEY = "wise_" + APP + "_local";

  var $ = function (id) { return document.getElementById(id); };
  var me = { room: "", pw: "", nick: "", group: "", solo: false };
  var timer = null;
  var draftTimer = null;

  /* ---------- 저장 ---------- */

  function dbUrl(path) { return DB + "/wise/" + APP + "/" + path + ".json"; }

  function dbGet(path) {
    return fetch(dbUrl(path)).then(function (r) { return r.json(); });
  }
  function dbPut(path, data) {
    return fetch(dbUrl(path), {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).then(function (r) { return r.json(); });
  }
  function dbPush(path, data) {
    return fetch(dbUrl(path), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).then(function (r) { return r.json(); });
  }

  function sheetBackup(record) {
    try {
      var q = JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
      q.push(record);
      localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
      if (SHEET_ENDPOINT.indexOf("http") !== 0) { return; }
      fetch(SHEET_ENDPOINT, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ rows: q })
      }).then(function () {
        localStorage.setItem(QUEUE_KEY, "[]");
      })["catch"](function () {});
    } catch (e) {}
  }

  /* ---------- 도구 ---------- */

  function onlyDigits(s, n) {
    var out = "";
    for (var i = 0; i < s.length && out.length < n; i++) {
      if (s.charAt(i) >= "0" && s.charAt(i) <= "9") { out += s.charAt(i); }
    }
    return out;
  }

  function makeCode() {
    var s = "";
    for (var i = 0; i < 6; i++) { s += String(Math.floor(Math.random() * 10)); }
    return s;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }

  function barHtml(a, b) {
    return '<div class="bar"><i style="width:' + pct(a, b) + '%"></i></div>';
  }

  function show(id) {
    var ids = ["gate", "stage", "teacher", "present"];
    for (var i = 0; i < ids.length; i++) {
      $(ids[i]).className = ids[i] === id ? "" : "hide";
    }
  }

  /* 활동 화면이 부르는 골격 기능 */

  function wiseDraft(obj) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(obj)); } catch (e) {}
    $("w-sync").textContent = "이 기기에 임시 저장됨";
  }

  function wiseStep(i, n) {
    var h = "";
    for (var k = 0; k < n; k++) { h += '<span class="' + (k <= i ? "on" : "") + '"></span>'; }
    $("w-steps").innerHTML = h;
    $("w-steps").className = "steps";
  }

  function wiseNote(text) {
    if (!text) { $("w-note").className = "note hide"; return; }
    $("w-note").innerHTML = text;
    $("w-note").className = "note";
  }

  /* ---------- 활동 (차시별) ---------- */


  /* ---------- 자료 ---------- */

  var SIGNALS = ["초록불 · 그냥 써도 돼", "노랑불 · 조건을 지키면 돼",
    "주황불 · 아주 조심해서만", "빨간불 · 쓰면 안 돼"];

  var STEPS = [
    "문제를 겪는 사람에게 물어보기",
    "우리가 아는 것 적어 보기",
    "AI에게 아이디어 여러 개 받기",
    "우리 기준으로 걸러 내기",
    "직접 만들어 보기",
    "써 보고 고치기"
  ];

  var ROLES = [
    {t:"무엇을 만들지 정하기", who:"사람"},
    {t:"자료 찾아 정리하기", who:"둘 다"},
    {t:"아이디어 여러 개 떠올리기", who:"둘 다"},
    {t:"어떤 아이디어를 고를지 결정하기", who:"사람"},
    {t:"글 표현 다듬기", who:"둘 다"},
    {t:"결과를 책임지기", who:"사람"}
  ];

  var st = { cand: 0, scores: {}, order: [0, 1, 2, 3, 4, 5], roles: {}, signal: -1 };

  /* ---------- 화면 ---------- */

  function activityHtml() {
    var h = '<div class="card"><h2>1. 우리 모둠이 찾은 문제 후보</h2>' +
      '<p class="muted">우리 학교나 우리 동네에서 겪는 불편을 세 개 적어요.</p>';
    for (var i = 0; i < 3; i++) {
      h += '<label for="cand' + i + '">후보 ' + (i + 1) + '</label>' +
        '<input id="cand' + i + '" maxlength="60" placeholder="예: 급식 남는 양이 많다">' +
        '<div class="row" style="margin:6px 0 0">' +
        '<span class="muted" style="min-width:120px">우리가 바꿀 수 있나</span>';
      for (var a = 1; a <= 3; a++) {
        h += '<button type="button" class="chip sc" data-c="' + i + '" data-k="can" data-v="' + a +
          '" style="width:auto;margin:0">' + a + '</button>';
      }
      h += '</div><div class="row" style="margin:6px 0 0">' +
        '<span class="muted" style="min-width:120px">여러 명에게 도움되나</span>';
      for (var b = 1; b <= 3; b++) {
        h += '<button type="button" class="chip sc" data-c="' + i + '" data-k="many" data-v="' + b +
          '" style="width:auto;margin:0">' + b + '</button>';
      }
      h += '</div>';
    }
    h += '<div id="rank" style="margin-top:12px"></div></div>';

    h += '<div class="card"><h2>2. 고른 문제를 한 문장으로</h2>' +
      '<label for="who">누가</label><input id="who" maxlength="40" placeholder="예: 우리 학교 5학년이">' +
      '<label for="when">언제</label><input id="when" maxlength="40" placeholder="예: 점심시간에">' +
      '<label for="what">무엇 때문에 불편한가</label>' +
      '<input id="what" maxlength="60" placeholder="예: 먹을 양을 고를 수 없어서">' +
      '<div class="note" id="oneline">칸을 채우면 한 문장이 만들어져요.</div></div>';

    h += '<div class="card"><h2>3. 이 문제에 AI를 어떻게 쓸까</h2>' +
      '<p class="muted">6차시 신호등으로 판단하고 까닭을 써요.</p>';
    for (var s = 0; s < SIGNALS.length; s++) {
      h += '<button type="button" class="chip sig" data-s="' + s + '">' + esc(SIGNALS[s]) + '</button>';
    }
    h += '<label for="why">그렇게 판단한 까닭</label>' +
      '<textarea id="why" maxlength="300" placeholder="어떤 조건이면 되는지도 함께 써요"></textarea></div>';

    h += '<div class="card"><h2>4. 해결 절차 세우기</h2>' +
      '<p class="muted">순서를 바꾸어 우리 모둠의 절차를 만들어요. 위에 있는 것부터 해요.</p>' +
      '<div id="steps"></div></div>';

    h += '<div class="card"><h2>5. 사람과 AI의 역할 나누기</h2><div id="roles"></div>' +
      '<p class="muted" id="rolemsg" style="margin-top:8px"></p></div>';

    h += '<div class="safe">이름, 사진, 친구 이야기 같은 개인정보는 넣지 않아요.</div>';
    return h;
  }

  function stepsHtml() {
    var h = "";
    for (var i = 0; i < st.order.length; i++) {
      var s = STEPS[st.order[i]];
      h += '<div class="card" style="margin:8px 0;padding:12px"><div class="row" ' +
        'style="justify-content:space-between"><span>' + (i + 1) + '. ' + esc(s) + '</span>' +
        '<span><button type="button" class="chip up" data-i="' + i +
        '" style="width:auto;margin:0">위로</button></span></div></div>';
    }
    return h;
  }

  function rolesHtml() {
    var h = "";
    for (var i = 0; i < ROLES.length; i++) {
      h += '<div class="card" style="margin:8px 0;padding:12px"><p style="margin:0 0 8px">' +
        esc(ROLES[i].t) + '</p><div class="row">';
      var opts = ["사람", "AI", "둘 다"];
      var oi = ["me", "ai", "both"];
      for (var o = 0; o < opts.length; o++) {
        h += '<button type="button" class="chip role" data-r="' + i + '" data-w="' + o +
          '" style="width:auto;margin:0">' + wiseIcon(oi[o], 24) + opts[o] + '</button>';
      }
      h += '</div></div>';
    }
    return h;
  }

  function paintRank() {
    if (!$("rank")) { return; }
    var rows = [];
    for (var i = 0; i < 3; i++) {
      var t = $("cand" + i) ? $("cand" + i).value.trim() : "";
      if (!t) { continue; }
      var can = Number((st.scores[i] || {}).can || 0);
      var many = Number((st.scores[i] || {}).many || 0);
      rows.push({ i: i, t: t, sum: can + many, can: can, many: many });
    }
    if (!rows.length) { $("rank").innerHTML = '<p class="muted">후보를 적으면 순위가 나와요.</p>'; return; }
    rows.sort(function (a, b) { return b.sum - a.sum; });
    var h = '<div class="scroll"><table><tr><th>후보</th><th>바꿀 수 있나</th><th>도움되나</th><th>합계</th></tr>';
    for (var k = 0; k < rows.length; k++) {
      h += "<tr><td>" + esc(rows[k].t) + "</td><td>" + rows[k].can + "</td><td>" + rows[k].many +
        "</td><td>" + rows[k].sum + "</td></tr>";
    }
    h += "</table></div>";
    if (rows[0].sum) {
      h += '<p class="ok" style="margin-top:8px">지금 1위 : ' + esc(rows[0].t) + '</p>';
      st.cand = rows[0].i;
    }
    $("rank").innerHTML = h;
  }

  function paintOne() {
    if (!$("oneline")) { return; }
    var who = val("who"), when = val("when"), what = val("what");
    if (!who && !when && !what) {
      $("oneline").textContent = "칸을 채우면 한 문장이 만들어져요.";
      return;
    }

      if (saved.signal !== undefined) { st.signal = saved.signal; }
      var keys = ["cand0", "cand1", "cand2", "who", "when", "what", "why"];
      for (var k = 0; k < keys.length; k++) {
        if (saved[keys[k]] && $(keys[k])) { $(keys[k]).value = saved[keys[k]]; }
      }
    }
    var ids = ["cand0", "cand1", "cand2", "who", "when", "what"];
    for (var i = 0; i < ids.length; i++) {
      if ($(ids[i])) { $(ids[i]).oninput = function () { paintRank(); paintOne(); }; }

    var scs = document.querySelectorAll("#activity .sc");

        if (d) { wiseDraft(d); }
      } catch (e) {}
    }, 8000);
  }

  function submit() {
    var payload = activityCollect();
    if (payload === null) { return; }

    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(payload)); } catch (e) {}

    if (me.solo) {
      $("w-msg").innerHTML = '<span class="ok">이 기기에만 저장했어요. 혼자 체험 중이에요.</span>';
      return;
    }

    var record = {
      nick: me.nick, group: me.group, app: APP,
      room: me.room, at: Date.now(), payload: payload
    };

    $("w-sync").textContent = "저장 중...";
    dbPush(me.room + "/entries", record).then(function () {
      $("w-sync").textContent = "저장됨";
      $("w-msg").innerHTML = '<span class="ok">제출했어요. 고쳐서 다시 제출해도 괜찮아요.</span>';
      sheetBackup(record);
    })["catch"](function () {
      $("w-sync").textContent = "저장 실패";
      $("w-msg").innerHTML = '<span class="warn">인터넷이 불안정해요. 쓴 내용은 이 기기에 남아 있어요. 잠시 뒤 다시 제출해 주세요.</span>';
    });
  }

  /* ---------- 교사 흐름 ---------- */

  function teacherMake() {
    var code = makeCode();
    var pw = onlyDigits($("w-pw").value, 4) || "0000";
    dbPut(code + "/meta", { app: APP, pw: pw, at: Date.now(), locked: false })
      .then(function () { teacherOpen(code, pw); })
      ["catch"](function () { alert("방을 만들지 못했어요. 인터넷을 확인해 주세요."); });
  }

  function teacherOpen(code, pw) {
    me.room = code;
    $("t-code").textContent = code;
    $("t-pw").textContent = "비밀번호 " + (pw || "-") + " · 이 화면을 닫아도 방은 사라지지 않아요.";
    $("t-room").className = "";
    $("t-board").className = "card";
    teacherRefresh();
    if (timer) { clearInterval(timer); }
    timer = setInterval(teacherRefresh, 3000);
  }

  function teacherRefresh() {
    if (!me.room) { return; }
    dbGet(me.room + "/entries").then(function (data) {
      var rows = [];
      for (var k in data) { if (data.hasOwnProperty(k)) { rows.push(data[k]); } }
      rows.sort(function (a, b) { return (a.at || 0) - (b.at || 0); });

      var latest = {};
      for (var i = 0; i < rows.length; i++) { latest[rows[i].nick] = rows[i]; }
      var list = [];
      for (var n in latest) { if (latest.hasOwnProperty(n)) { list.push(latest[n]); } }

      $("t-count").textContent = list.length + "명";
      $("t-note").textContent = noteFor(list, rows.length);
      $("t-summary").innerHTML = teacherSummary(list);
      $("t-table").innerHTML = teacherTable(list);
      window.__wiseRows = list;
      if ($("present").className === "") { paintPresent(list); }
    })["catch"](function () {});
  }

  function noteFor(list, tries) {
    if (!list.length) { return "아직 제출이 없어요. 학생에게 방 코드를 알려 주세요."; }
    var groups = {}, n = 0;
    for (var i = 0; i < list.length; i++) {
      var g = list[i].group || "모둠 없음";
      if (!groups[g]) { groups[g] = 0; n++; }
      groups[g] += 1;
    }
    var last = 0;
    for (var k = 0; k < list.length; k++) { if (list[k].at > last) { last = list[k].at; } }
    return "모둠 " + n + "개 · 제출 시도 " + tries + "회 · 마지막 제출 " +
      new Date(last).toLocaleTimeString("ko-KR");
  }

  function paintPresent(list) {
    var html = "";
    try {
      html = (typeof presentHtml === "function") ? presentHtml(list) : teacherSummary(list);
    } catch (e) { html = teacherSummary(list); }
    $("p-title").textContent = "우리 반 결과 · " + list.length + "명";
    $("p-body").innerHTML = html;
  }

  function teacherTable(list) {
    var h = "<tr><th>닉네임</th><th>모둠</th><th>제출 시각</th><th>내용</th></tr>";
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      h += "<tr><td>" + esc(r.nick) + "</td><td>" + esc(r.group) + "</td><td>" +
        new Date(r.at).toLocaleTimeString("ko-KR") + "</td><td>" +
        esc(JSON.stringify(r.payload).slice(0, 180)) + "</td></tr>";
    }
    return h;
  }

  function toCsv(list) {
    var lines = ["닉네임,모둠,제출시각,내용"];
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      lines.push([r.nick, r.group, new Date(r.at).toLocaleString("ko-KR"),
        JSON.stringify(r.payload)].map(function (v) {
          return '"' + String(v).split('"').join('""') + '"';
        }).join(","));
    }
    return lines.join("\n");
  }

  function download() {
    var list = window.__wiseRows || [];
    var blob = new Blob(["\ufeff" + toCsv(list)], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = APP + "_" + me.room + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  /* ---------- 연결 ---------- */

  $("w-enter").onclick = function () { enter(false); };
  $("w-solo").onclick = function () { enter(true); };
  $("w-teacher").onclick = function () { show("teacher"); };
  $("w-submit").onclick = submit;
  $("w-leave").onclick = function () {
    if (timer) { clearInterval(timer); }
    if (draftTimer) { clearInterval(draftTimer); }
    show("gate");
  };

  $("t-make").onclick = teacherMake;
  $("t-open").onclick = function () {
    var code = onlyDigits(prompt("방 코드 6자리를 넣어 주세요.") || "", 6);
    if (code.length === 6) { teacherOpen(code, ""); }
  };
  $("t-back").onclick = function () { if (timer) { clearInterval(timer); } show("gate"); };
  $("t-refresh").onclick = teacherRefresh;
  $("t-csv").onclick = download;
  $("t-detail").onclick = function () {
    var open = $("t-wrap").className.indexOf("hide") < 0;
    $("t-wrap").className = open ? "scroll hide" : "scroll";
    this.textContent = open ? "낱낱이 보기 켜기" : "낱낱이 보기 끄기";
  };
  $("t-present").onclick = function () {
    paintPresent(window.__wiseRows || []);
    show("present");
  };
  $("p-close").onclick = function () { show("teacher"); };
  $("t-lock").onclick = function () {
    dbPut(me.room + "/meta/locked", true).then(function () { alert("방을 잠갔어요."); });
  };
  $("t-copy").onclick = function () {
    var code = $("t-code").textContent;
    var done = function () { $("t-copy").textContent = "복사됨";
      setTimeout(function () { $("t-copy").textContent = "복사"; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done)["catch"](function () { fallbackCopy(code, done); });
    } else { fallbackCopy(code, done); }
  };

  /* 입장 화면에 이 활동을 소개하는 그림을 깐다. 혼자 열어 본 학생을 위한 것이다. */
  if (typeof activityIntro === "function") {
    try {
      $("w-intro").innerHTML = activityIntro();
      $("w-intro").className = "intro";
    } catch (e) {}
  }

  /* 자동 검사용 통로. 수업 화면에는 영향이 없다. */
  if (typeof window !== "undefined") {
    window.__wiseTest = {
      app: APP,
      activityHtml: activityHtml,
      activityInit: activityInit,
      activityCollect: activityCollect,
      teacherSummary: teacherSummary,
      presentHtml: (typeof presentHtml === "function") ? presentHtml : null,
      activityAutofill: (typeof activityAutofill === "function") ? activityAutofill : null,
      setMe: function (v) { me = v; }
    };
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { alert(text); }
    document.body.removeChild(ta);
  }
})();
</script>
