<meta charset="utf-8">
<div id="wise-app">
<style>
#wise-app *,#wise-app *::before,#wise-app *::after{box-sizing:border-box}
#wise-app{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--paper:#fff;--bg:#f6f7f9;
--accent:#2563eb;--accent-soft:#eff6ff;
--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
color:var(--ink);background:var(--bg);line-height:1.65;font-size:16px;
padding:18px;max-width:1040px;margin:0 auto;-webkit-text-size-adjust:100%}
#wise-app h1,#wise-app h2,#wise-app h3{margin:0;font-weight:700;line-height:1.3;letter-spacing:-.01em}
#wise-app .hd{background:var(--accent);color:#fff;border-radius:18px;padding:20px 22px;margin-bottom:16px;
box-shadow:var(--shadow);position:relative;overflow:hidden}
#wise-app .hd::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;
border-radius:50%;background:rgba(255,255,255,.10)}
#wise-app .hd h1{font-size:23px}
#wise-app .hd p{margin:6px 0 0;font-size:14px;opacity:.94}
#wise-app .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;
margin-bottom:14px;box-shadow:var(--shadow)}
#wise-app .card h2{font-size:18px;margin-bottom:10px}
#wise-app .card h3{font-size:16px}
#wise-app .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#wise-app label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px;font-weight:600}
#wise-app input,#wise-app textarea,#wise-app select{
width:100%;font:inherit;font-size:18px;padding:13px 14px;border:1px solid var(--line);
border-radius:12px;background:#fff;color:var(--ink)}
#wise-app input:focus,#wise-app textarea:focus,#wise-app select:focus{
outline:3px solid var(--accent-soft);border-color:var(--accent)}
#wise-app textarea{min-height:104px;resize:vertical}
#wise-app button{font:inherit;font-size:16px;font-weight:600;min-height:48px;padding:12px 18px;
border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
#wise-app button.ghost{background:#fff;color:var(--accent)}
#wise-app button.plain{background:#fff;color:var(--muted);border-color:var(--line)}
#wise-app button:disabled{opacity:.45;cursor:not-allowed}
#wise-app .code{font-size:38px;font-weight:800;letter-spacing:.16em;color:var(--accent)}
#wise-app .muted{color:var(--muted);font-size:14px}
#wise-app .pill{display:inline-block;padding:5px 11px;border-radius:999px;background:var(--accent-soft);
color:var(--accent);font-size:13px;font-weight:700}
#wise-app .tag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--bg);
border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;margin-right:4px}
#wise-app .hide{display:none}
#wise-app .bucket{border:2px dashed var(--line);border-radius:14px;padding:12px;min-height:120px;background:#fff}
#wise-app .bucket h3{font-size:15px;margin-bottom:8px}
#wise-app .grid{display:grid;gap:12px}
#wise-app .g2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
#wise-app .chip{display:block;width:100%;text-align:left;padding:13px 15px;margin-bottom:8px;
border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:600;min-height:48px}
#wise-app .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
#wise-app .bar{height:14px;border-radius:8px;background:var(--line);overflow:hidden}
#wise-app .bar>i{display:block;height:100%;background:var(--accent)}
#wise-app .steps{display:flex;gap:6px;margin:12px 0 0}
#wise-app .steps>span{flex:1;height:8px;border-radius:6px;background:var(--line)}
#wise-app .steps>span.on{background:var(--accent)}
#wise-app table{width:100%;border-collapse:collapse;font-size:14px}
#wise-app th,#wise-app td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
#wise-app th{background:var(--bg);font-weight:700}
#wise-app .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
#wise-app .safe{margin-top:14px;padding:13px 15px;border-radius:12px;background:#fff7ed;
border:1px solid #fed7aa;color:#9a3412;font-size:14px}
#wise-app .note{padding:12px 14px;border-radius:12px;background:var(--accent-soft);
color:var(--accent);font-size:14px;font-weight:600;margin-top:12px}
#wise-app .ok{color:#15803d;font-weight:700}
#wise-app .warn{color:#b45309;font-weight:700}
#wise-app .big{font-size:30px;font-weight:800;line-height:1.25}
#wise-app .foot{text-align:center;color:var(--muted);font-size:12px;padding:16px 0}
#wise-app .wtop{position:sticky;top:0;z-index:40;display:flex;gap:8px;align-items:center;
flex-wrap:nowrap;overflow-x:auto;background:var(--bg);padding:10px 0;margin:-18px 0 10px}
#wise-app .wtop a,#wise-app .wtop button{font-size:13px;font-weight:700;color:var(--ink);
background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:38px;
white-space:nowrap;text-decoration:none;cursor:pointer}
#wise-app .wtop a:hover,#wise-app .wtop button:hover{background:var(--accent-soft);color:var(--accent)}
#wise-app .wi{vertical-align:middle;margin-right:8px;flex:none}
#wise-app .ws-scene{display:block;width:100%;height:164px;border:2px solid var(--line);
border-radius:14px;background:#fff;margin:10px 0 6px}
#wise-app .iconrow{display:flex;align-items:center;gap:8px}
#wise-app .quest{display:none}
#wise-app .quest.on{display:block;animation:wfade .25s ease-out}
@keyframes wfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#wise-app .hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);
border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:700;font-size:14px;color:var(--accent)}
#wise-app .hud .grow{flex:1;min-width:120px}
#wise-app .hud .bar{background:#fff}
#wise-app .tile{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;

box-shadow:var(--shadow);color:var(--ink)}
#wise-app .tile small{font-weight:600;color:var(--muted);font-size:13px}
#wise-app .tile.done{border-color:var(--accent);background:var(--accent-soft)}
#wise-app .cele{position:fixed;inset:0;background:rgba(17,24,39,.55);display:flex;align-items:center;
justify-content:center;padding:20px;z-index:60}
#wise-app .cele .box{background:#fff;border-radius:22px;padding:26px;max-width:460px;width:100%;
text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.3)}
#wise-app .cele h2{font-size:24px;margin-bottom:10px}
#wise-app .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);
color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;z-index:70}
#wise-app canvas{max-width:100%;height:auto;border-radius:12px}
#wise-app .intro{margin:-4px 0 16px}
#wise-app .intro svg{display:block;width:100%;height:168px;border:2px solid var(--line);
border-radius:14px;background:#fff}
#wise-app .intro p{margin:10px 0 0;font-size:15px;color:var(--muted)}
#wise-app .intro b{color:var(--ink)}
#wise-app #present .card{border-radius:20px}
#wise-app #present table{font-size:19px}
#wise-app #present .big{font-size:44px}
@media (max-width:640px){#wise-app{padding:10px;font-size:15px}#wise-app .hd h1{font-size:19px}
#wise-app .g2{grid-template-columns:1fr}#wise-app .intro svg{height:126px}
#wise-app .ws-scene{height:120px}}
@media (prefers-reduced-motion:reduce){#wise-app *{transition:none!important;animation:none!important}}
</style>

<script>
(function () {
  "use strict";

  var APP = "data-lab";
  var DB = "https://remind-c2610-default-rtdb.firebaseio.com";
  var SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbyIqxbv5JObUl2eN7iSZ-HDcDcHtaKxHlEpuNfkfPQMmJUKrwIMnlUsqKH20OOeOs4/exec";
  var QUEUE_KEY = "wise_backup_queue";
  var LOCAL_KEY = "wise_" + APP + "_local";
  var ACCENT = "#2563eb";
  var COPYRIGHT_LINE = "2026년 티처스랩 5기 교사연구회 A.N.D · CC BY-NC-SA";

  var $ = function (id) { return document.getElementById(id); };
  var me = { room: "", pw: "", nick: "", group: "", solo: false };
  var timer = null;
  var draftTimer = null;

  /* ---------- 저장 ---------- */

  function dbUrl(path) { return DB + "/wise/" + APP + "/" + path + ".json"; }

  function dbGet(path) {
    return fetch(dbUrl(path)).then(function (r) { return r.json(); });
  }
  function dbPut(path, data) {
    return fetch(dbUrl(path), {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).then(function (r) { return r.json(); });
  }
  function dbPush(path, data) {
    return fetch(dbUrl(path), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).then(function (r) { return r.json(); });
  }

  function sheetBackup(record) {
    try {
      var q = JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
      q.push(record);
      localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
      if (SHEET_ENDPOINT.indexOf("http") !== 0) { return; }
      fetch(SHEET_ENDPOINT, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ rows: q })
      }).then(function () {
        localStorage.setItem(QUEUE_KEY, "[]");
      })["catch"](function () {});
    } catch (e) {}
  }

  /* ---------- 도구 ---------- */

  function onlyDigits(s, n) {
    var out = "";
    for (var i = 0; i < s.length && out.length < n; i++) {
      if (s.charAt(i) >= "0" && s.charAt(i) <= "9") { out += s.charAt(i); }
    }
    return out;
  }

  function makeCode() {
    var s = "";
    for (var i = 0; i < 6; i++) { s += String(Math.floor(Math.random() * 10)); }
    return s;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }

  function barHtml(a, b) {
    return '<div class="bar"><i style="width:' + pct(a, b) + '%"></i></div>';
  }

  function show(id) {
    var ids = ["gate", "stage", "teacher", "present"];
    for (var i = 0; i < ids.length; i++) {
      $(ids[i]).className = ids[i] === id ? "" : "hide";
    }
  }

  /* 활동 화면이 부르는 골격 기능 */

  function wiseDraft(obj) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(obj)); } catch (e) {}
    $("w-sync").textContent = "이 기기에 임시 저장됨";
  }

  function wiseStep(i, n) {
    var h = "";
    for (var k = 0; k < n; k++) { h += '<span class="' + (k <= i ? "on" : "") + '"></span>'; }
    $("w-steps").innerHTML = h;
    $("w-steps").className = "steps";
  }

  /* 여정 화면 전환. 활동이 만든 .quest 조각을 갈아 끼운다. */
  function wiseGo(id) {
    var qs = document.querySelectorAll("#activity .quest");
    for (var i = 0; i < qs.length; i++) {
      qs[i].className = "quest" + (qs[i].getAttribute("data-q") === id ? " on" : "");
    }
    if (window.scrollTo) { window.scrollTo(0, 0); }
    if (typeof activityEnter === "function") {
      try { activityEnter(id); } catch (e) {}
    }
  }

  /* 상단 진행 표시. 여러 칸을 한 줄로 보여 준다. */
  function wiseHud(items) {
    var h = "";
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      h += '<span>' + esc(it.label) + ' ' + it.done + ' / ' + it.total + '</span>';
    }
    var first = items[0] || { done: 0, total: 1 };
    h += '<span class="grow">' + barHtml(first.done, first.total) + '</span>';
    $("w-hud").innerHTML = h;
    $("w-hud").className = "hud";
  }

  function wiseToast(text) {
    $("w-toast").textContent = text;
    $("w-toast").className = "toast";
    setTimeout(function () { $("w-toast").className = "toast hide"; }, 2200);
  }

  function wiseCelebrate(title, lines, buttonText) {
    var h = '<div class="box"><h2>' + esc(title) + '</h2>';
    for (var i = 0; i < lines.length; i++) {
      h += '<p class="muted" style="margin-top:6px">' + lines[i] + '</p>';
    }
    h += '<div class="row" style="justify-content:center;margin-top:16px">' +
      '<button type="button" id="cele-close">' + esc(buttonText || "닫기") + '</button></div></div>';
    $("w-cele").innerHTML = h;
    $("w-cele").className = "cele";
    $("cele-close").onclick = function () { $("w-cele").className = "cele hide"; };
  }

  /* 결과 카드를 그림으로 만들어 내려받는다. 교실에서 인쇄해 붙일 수 있다. */
  function wiseCardPng(title, lines, filename) {
    try {
      var c = document.createElement("canvas");
      c.width = 900; c.height = 560;
      var g = c.getContext("2d");
      g.fillStyle = "#ffffff"; g.fillRect(0, 0, 900, 560);
      g.fillStyle = ACCENT; g.fillRect(0, 0, 900, 120);
      g.fillStyle = "#ffffff"; g.font = "bold 40px sans-serif";
      g.fillText(title, 40, 76);
      g.fillStyle = "#111827"; g.font = "26px sans-serif";
      for (var i = 0; i < lines.length && i < 10; i++) {
        g.fillText(String(lines[i]).slice(0, 34), 40, 180 + i * 42);
      }
      g.fillStyle = "#6b7280"; g.font = "18px sans-serif";
      g.fillText(COPYRIGHT_LINE, 40, 530);
      var a = document.createElement("a");
      a.href = c.toDataURL("image/png");
      a.download = (filename || "wise_card") + ".png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      wiseToast("카드를 내려받았어요.");
    } catch (e) { wiseToast("이 기기에서는 카드 저장이 안 돼요."); }
  }

  /* 교사 화면용 막대 그림. 캔버스로 그린다. */
  function wiseBars(rows, width) {
    var w = width || 620, h = 42 * rows.length + 24;
    var c = document.createElement("canvas");
    if (!c || typeof c.getContext !== "function") { return barTable(rows); }
    c.width = w; c.height = h;
    var g = c.getContext("2d");
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h);
    var max = 1;
    for (var i = 0; i < rows.length; i++) { if (rows[i].value > max) { max = rows[i].value; } }
    for (var k = 0; k < rows.length; k++) {
      var y = 16 + k * 42;
      g.fillStyle = "#374151"; g.font = "bold 16px sans-serif";
      g.fillText(String(rows[k].label).slice(0, 14), 8, y + 20);
      var x0 = 160, bw = (w - 200) * rows[k].value / max;
      g.fillStyle = "#e5e7eb"; g.fillRect(x0, y, w - 200, 24);
      g.fillStyle = rows[k].color || ACCENT; g.fillRect(x0, y, bw, 24);
      g.fillStyle = "#111827"; g.font = "bold 15px sans-serif";
      g.fillText(String(rows[k].value), x0 + bw + 8, y + 18);
    }
    return '<img alt="분포 그림" style="width:100%" src="' + c.toDataURL("image/png") + '">';
  }

  /* 캔버스를 못 쓰는 자리에서는 표로 대신한다. */
  function barTable(rows) {
    var h = '<div class="scroll"><table><tr><th>항목</th><th>수</th><th>분포</th></tr>';
    var max = 1;
    for (var i = 0; i < rows.length; i++) { if (rows[i].value > max) { max = rows[i].value; } }
    for (var k = 0; k < rows.length; k++) {
      h += "<tr><td>" + esc(rows[k].label) + "</td><td>" + rows[k].value + "</td><td>" +

  function train(rows) {
    var m = {n:{}, f:{}, total:0};
    var i, k, lab;
    for (i = 0; i < LABELS.length; i++) {
      m.n[LABELS[i]] = 0;
      m.f[LABELS[i]] = {};
      for (k = 0; k < FEATS.length; k++) { m.f[LABELS[i]][FEATS[k]] = {}; }
    }
    for (i = 0; i < rows.length; i++) {
      lab = rows[i].label;
      if (LABELS.indexOf(lab) < 0) { continue; }
      m.n[lab] += 1;
      m.total += 1;
      for (k = 0; k < FEATS.length; k++) {
        var v = rows[i].card[FEATS[k]];
        var box = m.f[lab][FEATS[k]];
        box[v] = (box[v] || 0) + 1;
      }
    }
    return m;
  }

  function score(m, card) {
    var out = {};
    for (var i = 0; i < LABELS.length; i++) {
      var lab = LABELS[i];
      if (m.total === 0) { out[lab] = 0.5; continue; }
      var p = (m.n[lab] + 1) / (m.total + LABELS.length);
      for (var k = 0; k < FEATS.length; k++) {
        var box = m.f[lab][FEATS[k]];
        var hit = box[card[FEATS[k]]] || 0;
        p = p * ((hit + 1) / (m.n[lab] + 2));
      }
      out[lab] = p;
    }
    var sum = out[LABELS[0]] + out[LABELS[1]];
    if (sum <= 0) { return {강아지:0.5, 고양이:0.5}; }
    return {강아지: out["강아지"] / sum, 고양이: out["고양이"] / sum};
  }

  function predict(m, card) {
    var s = score(m, card);
    return {label: s["고양이"] >= s["강아지"] ? "고양이" : "강아지", p: Math.max(s["고양이"], s["강아지"])};
  }

  function evaluate(m) {
    var hit = 0, detail = [];
    for (var i = 0; i < TEST.length; i++) {
      var r = predict(m, TEST[i]);
      var ok = r.label === TEST[i].ans;
      if (ok) { hit++; }
      detail.push({id: TEST[i].id, i: i, got: r.label, ans: TEST[i].ans, ok: ok, p: r.p});
    }
    return {hit: hit, of: TEST.length, pct: Math.round(hit * 100 / TEST.length), detail: detail};
  }

  function tilt(m, card, f) {

    var b = ((m.f["고양이"][f][v] || 0) + 1) / (m.n["고양이"] + 2);
    var sum = a + b;
    return { cat: sum ? b / sum : 0.5, value: v };
  }

    if (st.preLabel[st.pre] === undefined) {
      h2 += '<div class="row">' +
        '<button type="button" class="chip pk" data-v="강아지" style="width:auto">강아지 같아요</button>' +
        '<button type="button" class="chip pk" data-v="고양이" style="width:auto">고양이 같아요</button></div>';
    } else {
      h2 += '<p class="ok">나는 ' + esc(st.preLabel[st.pre]) + ' 라고 보았어요.</p>' +
        '<label>무엇을 보고 정했나요</label>';
      for (var i = 0; i < REASON.length; i++) {
        h2 += '<button type="button" class="chip rs" data-k="' + REASON[i].k + '">' +
          esc(REASON[i].t) + '</button>';
      }
    }
    return h2;
  }

  function bindPre() {
    $("prebox").innerHTML = preHtml();
    var pks = document.querySelectorAll("#activity .pk");
    for (var i = 0; i < pks.length; i++) {
      pks[i].onclick = function () {
        st.preLabel[st.pre] = this.getAttribute("data-v");
        bindPre();
      };
    }
    var rss = document.querySelectorAll("#activity .rs");
    for (var j = 0; j < rss.length; j++) {
      rss[j].onclick = function () {
        st.preWhy[st.pre] = this.getAttribute("data-k");
        st.pre += 1;
        bindPre();
        paintHub();
      };
    }
    if ($("pre-go")) { $("pre-go").onclick = function () { wiseGo("label"); }; }
  }

  /* ---------- 2교시 ---------- */

  function labelHtml() {
    var c = TRAIN[st.i];
    var mine = st.label[c.id];
    var h = '<div style="text-align:center;margin:6px 0">' + faceSvg(c, true) +
      '<p class="muted">' + esc(featLine(c)) + '</p></div>' +
      '<div class="row" style="justify-content:center">' +
      '<button type="button" class="chip lb' + (mine === "강아지" ? " on" : "") +
      '" data-v="강아지" style="width:auto">강아지 이름표</button>' +
      '<button type="button" class="chip lb' + (mine === "고양이" ? " on" : "") +
      '" data-v="고양이" style="width:auto">고양이 이름표</button></div>';
    h += '<div style="margin-top:12px">' + barHtml(countLabel(), TRAIN.length) + '</div>' +
      '<p class="muted" style="margin-top:6px">배움 상자 ' + countLabel() + ' / ' + TRAIN.length + '장</p>';
    return h;
  }

  function countLabel() {
    var n = 0;
    for (var k in st.label) { if (st.label.hasOwnProperty(k) && st.label[k]) { n++; } }
    return n;
  }

  function bindLabel() {
    $("labelbox").innerHTML = labelHtml();
    if ($("l-pos")) { $("l-pos").textContent = (st.i + 1) + " / " + TRAIN.length; }
    var lbs = document.querySelectorAll("#activity .lb");
    for (var i = 0; i < lbs.length; i++) {
      lbs[i].onclick = function () {
        st.label[TRAIN[st.i].id] = this.getAttribute("data-v");
        if (st.i < TRAIN.length - 1) { st.i += 1; }
        bindLabel();
        paintHub();
        if (countLabel() === TRAIN.length) {
          award("성실한 선생님");
          wiseToast("이름표 스무 장을 다 붙였어요. 3교시로 가 볼까요?");
        }
      };
    }
  }

  function peekLabels() {
    if (me.solo) {
      $("classbox").innerHTML = '<p class="muted">둘러보기 중에는 우리 반 기록이 없어요. ' +
        '이름표 붙이기와 실험은 그대로 해 볼 수 있어요.</p>';
      return;
    }
    $("classbox").innerHTML = '<p class="muted">불러오는 중...</p>';
    dbGet(me.room + "/entries").then(function (data) {
      var tally = {};
      for (var k in data) {
        if (!data.hasOwnProperty(k)) { continue; }
        var lab = (data[k].payload || {}).labels || {};
        for (var id in lab) {
          if (!lab.hasOwnProperty(id)) { continue; }
          if (!tally[id]) { tally[id] = {강아지: 0, 고양이: 0}; }
          tally[id][lab[id]] += 1;
        }
      }
      st.classLabels = tally;
      $("classbox").innerHTML = classHtml(tally);
      paintHub();
    })["catch"](function () {
      $("classbox").innerHTML = '<p class="warn">지금은 불러올 수 없어요. 잠시 뒤 다시 눌러요.</p>';
    });
  }

  function classHtml(tally) {
    var rows = [];
    for (var id in tally) {
      if (!tally.hasOwnProperty(id)) { continue; }
      var t = tally[id], sum = t["강아지"] + t["고양이"];
      if (!sum) { continue; }
      rows.push({ id: id, dog: t["강아지"], cat: t["고양이"],
        gap: Math.abs(t["강아지"] - t["고양이"]) / sum });
    }
    if (!rows.length) { return '<p class="muted">아직 우리 반 이름표가 모이지 않았어요.</p>'; }
    rows.sort(function (a, b) { return a.gap - b.gap; });
    var h = '<h3>우리 반에서 갈린 카드</h3>' +
      '<p class="muted">같은 카드인데 이름표가 갈렸어요. 누가 맞고 틀린 게 아니라 기준이 다른 거예요.</p>' +
      '<div class="scroll"><table><tr><th>카드</th><th>강아지</th><th>고양이</th><th>내 이름표</th></tr>';
    for (var i = 0; i < rows.length && i < 5; i++) {
      var c = TRAIN[Number(rows[i].id)];
      h += "<tr><td>" + (c ? esc(featLine(c)) : rows[i].id) + "</td><td>" + rows[i].dog +
        "</td><td>" + rows[i].cat + "</td><td>" + esc(st.label[rows[i].id] || "-") + "</td></tr>";
    }
    return h + "</table></div>";
  }

  /* ---------- 3교시 ---------- */

  function rows(only) {
    var out = [];
    for (var i = 0; i < TRAIN.length; i++) {
      var lab = st.label[TRAIN[i].id];
      if (!lab) { continue; }
      if (only && lab === "고양이" && out.catCount === undefined) { /* 자리 표시 */ }
      out.push({ card: TRAIN[i], label: lab });
    }
    return out;
  }

  /* 굶길 쪽은 학생이 더 많이 붙인 이름표로 정한다. 그래야 결과가 실제로 무너진다. */
  function starveTarget() {
    var n = {강아지: 0, 고양이: 0};
    for (var k in st.label) {
      if (st.label.hasOwnProperty(k) && st.label[k]) { n[st.label[k]] += 1; }
    }
    return n["고양이"] >= n["강아지"] ? "고양이" : "강아지";
  }

  function starvedRows(keep) {
    var target = starveTarget(), seen = 0, out = [];
    for (var i = 0; i < TRAIN.length; i++) {
      var lab = st.label[TRAIN[i].id];
      if (!lab) { continue; }
      if (lab === target) {
        seen += 1;
        if (seen > keep) { continue; }
      }
      out.push({ card: TRAIN[i], label: lab });
    }
    return out;
  }

  function doTrain() {
    if (countLabel() < 6) {
      wiseToast("이름표를 여섯 장 넘게 붙인 뒤에 학습할 수 있어요.");
      return;
    }
    st.learning = true;
    $("mong").innerHTML = mongSvg("learn", 130) + '<p class="muted">배우는 중...</p>';
    var quick = false;
    try {
      quick = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    } catch (e) {}
    setTimeout(finishTrain, quick ? 0 : 1200);
  }

  function finishTrain() {
    var m = train(rows());
    st.full = evaluate(m);
    st.full.model = m;
    st.learning = false;
    $("mong").innerHTML = mongSvg(st.full.pct >= 60 ? "happy" : "sad", 130) +
      '<p class="muted">' + (st.full.pct >= 60 ? "배웠어요. 시험 볼 준비가 됐어요." : "아직 헷갈려요. 시험을 봐 볼까요?") + '</p>';
    var n = {강아지: 0, 고양이: 0};
    for (var k in st.label) {
      if (st.label.hasOwnProperty(k) && st.label[k]) { n[st.label[k]] += 1; }
    }
    var tip = '<p class="muted">학습을 마쳤어요. 시험 보기를 눌러요.</p>';
    if (n["강아지"] < 3 || n["고양이"] < 3) {
      tip += '<p class="warn">이름표가 한쪽으로 몰렸어요. 몽이는 한쪽만 배웠어요. ' +
        '2교시로 돌아가 다른 쪽 이름표도 붙여 보면 어떤 일이 생길까요?</p>';
    }
    $("exambox").innerHTML = tip;
    paintHub();
  }

  function examHtml() {
    if (!st.full) { return '<p class="muted">먼저 몽이를 학습시켜요.</p>'; }
    var r = st.full;
    var h = '<p class="big">' + r.pct + '점</p>' +
      '<p class="muted">시험 카드 ' + r.of + '장 가운데 ' + r.hit + '장을 맞혔어요.</p>' +
      barHtml(r.hit, r.of);
    h += '<h3 style="margin-top:16px">몽이의 답과 머릿속</h3>';
    for (var i = 0; i < r.detail.length; i++) {
      var d = r.detail[i], c = TEST[d.i];
      h += '<div class="card" style="margin:10px 0;padding:14px">' +
        '<div class="iconrow">' + faceSvg(c, false) +
        '<div><p style="font-weight:700">몽이 : ' + esc(d.got) + ' (' + Math.round(d.p * 100) + '%)</p>' +
        '<p class="' + (d.ok ? "ok" : "warn") + '">' + (d.ok ? "맞았어요" : "틀렸어요. 정답은 " + esc(d.ans)) + '</p>' +
        '<p class="muted">' + esc(featLine(c)) + '</p></div></div>';
      h += '<div class="scroll" style="margin-top:8px"><table><tr><th>특징</th><th>몽이가 기운 쪽</th><th></th></tr>';
      for (var k = 0; k < FEATS.length; k++) {
        var t = tilt(st.full.model, c, FEATS[k]);
        var pctCat = Math.round(t.cat * 100);
        h += "<tr><td>" + esc(FEAT_NAME[FEATS[k]]) + " " + esc(t.value) + "</td><td>고양이 " +
          pctCat + "%</td><td>" + barHtml(pctCat, 100) + "</td></tr>";
      }
      h += "</table></div></div>";
    }
    return h;
  }

  /* ---------- 4교시 ---------- */

  function doCut() {
    if (!st.full) { wiseToast("3교시에서 먼저 학습과 시험을 마쳐요."); return; }
    st.keep = Number($("keep").value);
    var m = train(starvedRows(st.keep));
    st.cut = evaluate(m);
    st.cut.keep = st.keep;
    st.cut.target = starveTarget();
    award("실험가");
    $("cutbox").innerHTML = cutHtml();
    paintHub();
  }

  function cutHtml() {
    if (!st.cut) { return '<p class="muted">슬라이더를 옮기고 다시 학습을 눌러요.</p>'; }
    var h = wiseBars([
      { label: "전체 학습", value: st.full.pct, color: "#16a34a" },
      { label: "편식 학습", value: st.cut.pct, color: "#dc2626" }
    ], 520);
    h += '<p style="margin-top:10px">' + esc(st.cut.target || "고양이") + ' 카드를 <b>' +
      st.cut.keep + '장</b>만 남겼더니 ' + st.full.pct + '점에서 <b>' + st.cut.pct +
      '점</b>이 되었어요.</p>';
    if (st.cut.pct === st.full.pct) {
      h += '<p class="muted">점수가 그대로예요. 더 줄여 보거나, 2교시로 돌아가 이름표를 고르게 붙여 봐요.</p>';
    }
    var wrong = [];
    for (var i = 0; i < st.cut.detail.length; i++) {
      if (!st.cut.detail[i].ok) { wrong.push(st.cut.detail[i]); }
    }
    if (wrong.length) {
      h += '<h3 style="margin-top:14px">틀린 카드</h3><div class="row">';
      for (var k = 0; k < wrong.length; k++) {
        var c = TEST[wrong[k].i];
        h += '<div class="card" style="margin:0;padding:10px;text-align:center;width:150px">' +
          faceSvg(c, false) + '<p class="muted" style="font-size:12px">정답 ' + esc(wrong[k].ans) +
          '<br>몽이 ' + esc(wrong[k].got) + '</p></div>';
      }
      h += '</div>';
      h += '<p class="muted" style="margin-top:8px">틀린 카드가 한쪽으로 몰려 있나요? 왜 그럴까요?</p>';
    } else {
      h += '<p class="ok" style="margin-top:10px">이번에는 다 맞혔어요. 더 줄여 볼까요?</p>';
    }
    return h;
  }

  /* ---------- 5교시 ---------- */

  function roleHtml() {
    var h = "";
    for (var i = 0; i < ROLE_ITEMS.length; i++) {
      h += '<div class="card" style="margin:8px 0;padding:12px">' +
        '<p style="margin:0 0 8px;font-weight:600">' + esc(ROLE_ITEMS[i]) + '</p><div class="row">' +
        '<button type="button" class="chip rl' + (st.role[i] === "사람" ? " on" : "") +
        '" data-i="' + i + '" data-v="사람" style="width:auto;margin:0">' + wiseIcon("me", 22) + '사람</button>' +
        '<button type="button" class="chip rl' + (st.role[i] === "AI" ? " on" : "") +
        '" data-i="' + i + '" data-v="AI" style="width:auto;margin:0">' + wiseIcon("ai", 22) + '몽이(AI)</button>' +
        '</div></div>';
    }
    return h;
  }

  function bindRole() {
    $("rolebox").innerHTML = roleHtml();
    var rls = document.querySelectorAll("#activity .rl");
    for (var i = 0; i < rls.length; i++) {
      rls[i].onclick = function () {
        st.role[this.getAttribute("data-i")] = this.getAttribute("data-v");
        bindRole();
        paintHub();
      };
    }
  }

  function roleCount() {
    var n = 0;
    for (var k in st.role) { if (st.role.hasOwnProperty(k)) { n++; } }
    return n;
  }

  /* ---------- 성적표 ---------- */

  function reportHtml() {
    var dog = 0, cat = 0;
    for (var k in st.label) {
      if (!st.label.hasOwnProperty(k)) { continue; }
      if (st.label[k] === "강아지") { dog++; } else if (st.label[k] === "고양이") { cat++; }
    }
    var h = '<div style="text-align:center">' + mongSvg(st.full && st.full.pct >= 60 ? "happy" : "new", 120) + '</div>';
    h += '<div class="scroll"><table>' +
      '<tr><th>이름표</th><td>강아지 ' + dog + '장 · 고양이 ' + cat + '장</td></tr>' +
      '<tr><th>전체 학습</th><td>' + (st.full ? st.full.pct + '점' : '아직') + '</td></tr>' +
      '<tr><th>편식 학습</th><td>' + (st.cut ? st.cut.pct + '점 (' + (st.cut.target || "고양이") +
        ' ' + st.cut.keep + '장)' : '아직') + '</td></tr>' +
      '<tr><th>역할 나누기</th><td>' + roleCount() + ' / ' + ROLE_ITEMS.length + '개</td></tr>' +
      '</table></div>';
    h += '<label for="report-line">오늘 배운 것을 한 줄로</label>' +
      '<input id="report-line" maxlength="80" placeholder="예: 데이터를 누가 주느냐에 따라 AI가 달라진다" value="' +
      esc(st.line) + '">';
    return h;
  }

  /* ---------- 배지와 허브 ---------- */

  function award(name) {
    if (st.badges[name]) { return; }
    st.badges[name] = true;
    wiseToast("배지를 받았어요 : " + name);
    paintHub();
  }

  function paintHub() {
    if (!$("s-label")) { return; }
    $("s-pre").textContent = st.pre >= 3 ? "세 장을 다 판단했어요" : "사람이 먼저 판단해요";
    $("s-label").textContent = "이름표 " + countLabel() + " / " + TRAIN.length + "장";
    $("s-exam").textContent = st.full ? ("정확도 " + st.full.pct + "점") : "몽이를 가르치고 시험 보기";
    $("s-cut").textContent = st.cut ? ("편식 정확도 " + st.cut.pct + "점") : "한쪽을 줄이면 어떻게 될까";
    $("s-role").textContent = "나눈 항목 " + roleCount() + " / " + ROLE_ITEMS.length + "개";
    $("s-report").textContent = "오늘의 기록";
    var tiles = [["t-pre", st.pre >= 3], ["t-label", countLabel() >= TRAIN.length],
      ["t-exam", !!st.full], ["t-cut", !!st.cut], ["t-role", roleCount() >= 5], ["t-report", false]];
    for (var i = 0; i < tiles.length; i++) {
      if ($(tiles[i][0])) { $(tiles[i][0]).className = "tile" + (tiles[i][1] ? " done" : ""); }
    }
    var names = [];
    for (var b in st.badges) { if (st.badges.hasOwnProperty(b)) { names.push(b); } }
    $("badges").innerHTML = names.length
      ? names.map(function (n) { return '<span class="pill">' + esc(n) + '</span>'; }).join(" ")
      : '<span class="muted">아직 없어요. 이름표를 붙이면 받을 수 있어요.</span>';
    wiseHud([
      { label: "이름표", done: countLabel(), total: TRAIN.length },
      { label: "정확도", done: st.full ? st.full.pct : 0, total: 100 },
      { label: "역할 나누기", done: roleCount(), total: ROLE_ITEMS.length }
    ]);
  }

  /* ---------- 흐름 ---------- */

  function activityEnter(id) {
    if (id === "pre") { bindPre(); }
    if (id === "label") { bindLabel(); }
    if (id === "exam") { $("exambox").innerHTML = examHtml(); }
    if (id === "cut") {
      if ($("keeptarget")) { $("keeptarget").textContent = starveTarget(); }
      $("cutbox").innerHTML = cutHtml();
    }
    if (id === "role") { bindRole(); }
    if (id === "report") { $("reportbox").innerHTML = reportHtml(); }
    if (id === "hub") { paintHub(); }
  }

  function activityInit(saved) {
    if (saved) {
      if (saved.labels) { st.label = saved.labels; }
      if (saved.roles) { st.role = saved.roles; }
      if (saved.line) { st.line = saved.line; }
    }
    $("go-hub").onclick = function () { wiseGo("hub"); };
    $("t-pre").onclick = function () { wiseGo("pre"); };
    $("t-label").onclick = function () { wiseGo("label"); };
    $("t-exam").onclick = function () { wiseGo("exam"); };
    $("t-cut").onclick = function () { wiseGo("cut"); };
    $("t-role").onclick = function () { wiseGo("role"); };
    $("t-report").onclick = function () { wiseGo("report"); };
    $("l-prev").onclick = function () { if (st.i > 0) { st.i -= 1; bindLabel(); } };
    $("l-next").onclick = function () { if (st.i < TRAIN.length - 1) { st.i += 1; bindLabel(); } };
    $("l-undo").onclick = function () {
      st.label[TRAIN[st.i].id] = "";
      bindLabel();
      paintHub();
    };
    $("l-peek").onclick = peekLabels;
    $("do-train").onclick = doTrain;
    $("do-exam").onclick = function () {
      if (!st.full) { wiseToast("먼저 몽이를 학습시켜요."); return; }
      $("exambox").innerHTML = examHtml();
      if (st.full.pct >= 80) { award("좋은 선생님"); }
    };
    $("keep").oninput = function () { $("keepnum").textContent = this.value; };
    $("do-cut").onclick = doCut;
    $("save-card").onclick = function () {
      wiseCardPng("몽이 성적표 · " + me.nick, [
        "이름표 " + countLabel() + "장을 붙였어요",
        "전체 학습 " + (st.full ? st.full.pct : 0) + "점",
        "편식 학습 " + (st.cut ? st.cut.pct + "점 (" + (st.cut.target || "고양이") + " " +
          st.cut.keep + "장)" : "안 함"),
        val("report-line") || "오늘 나는 몽이의 선생님이었다"
      ], "wise_l01_" + me.nick);
      award("생각 기록자");
    };
    var backs = document.querySelectorAll("#activity .back");
    for (var i = 0; i < backs.length; i++) {
      backs[i].onclick = function () { wiseGo("hub"); };
    }
    wiseNote("몽이는 여러분이 가르친 대로 배워요. 이름표부터 붙여 볼까요?");
    wiseGo("story");
    paintHub();
  }

  function val(id) { return $(id) ? $(id).value.trim() : ""; }

  function activityDraft() {
    return { labels: st.label, roles: st.role, line: val("cutline") };
  }

  function activityAutofill() {
    for (var i = 0; i < TRAIN.length; i++) {
      st.label[TRAIN[i].id] = TRAIN[i].ear === "뾰족" ? "고양이" : "강아지";
    }
    var m = train(rows());
    st.full = evaluate(m);
    st.full.model = m;
    st.cut = evaluate(train(starvedRows(2)));
    st.cut.keep = 2;
    for (var r = 0; r < ROLE_ITEMS.length; r++) { st.role[r] = r % 3 === 0 ? "AI" : "사람"; }
    st.pre = 3;

  function teacherSummary(list) {

      if (p.acc && p.acc.full !== undefined && p.acc.full !== null) { full += p.acc.full; nFull++; }
      if (p.acc && p.acc.starved !== undefined && p.acc.starved !== null) { cut += p.acc.starved; nCut++; }
      var lab = p.labels || {};
      for (var id in lab) {
        if (!lab.hasOwnProperty(id) || !lab[id]) { continue; }
        if (!tally[id]) { tally[id] = {강아지: 0, 고양이: 0}; }
        tally[id][lab[id]] += 1;
      }
    }
    var h = wiseBars([
      { label: "전체 학습 평균", value: nFull ? Math.round(full / nFull) : 0, color: "#16a34a" },
      { label: "편식 학습 평균", value: nCut ? Math.round(cut / nCut) : 0, color: "#dc2626" }
    ], 560);

    var rows2 = [];
    for (var id2 in tally) {
      if (!tally.hasOwnProperty(id2)) { continue; }
      var t = tally[id2], sum = t["강아지"] + t["고양이"];
      if (!sum) { continue; }
      rows2.push({ id: id2, dog: t["강아지"], cat: t["고양이"], gap: Math.abs(t["강아지"] - t["고양이"]) / sum });
    }
    rows2.sort(function (a, b) { return a.gap - b.gap; });

      '<div class="scroll"><table><tr><th>카드</th><th>강아지</th><th>고양이</th></tr>';

  /* ---------- 학생 흐름 ---------- */

  function enter(solo) {
    var room = onlyDigits($("w-room").value, 6);
    var pw = onlyDigits($("w-pw").value, 4);
    var nick = $("w-nick").value.trim();
    var group = $("w-group").value.trim();

    if (!nick) { $("w-gate-msg").textContent = "닉네임을 써 주세요."; return; }
    if (!solo && room.length !== 6) { $("w-gate-msg").textContent = "방 코드 6자리를 정확히 써 주세요."; return; }

    me = { room: solo ? "solo" : room, pw: pw, nick: nick, group: group, solo: !!solo };
    $("w-who").textContent = me.nick + (me.group ? " · " + me.group : "") +
      (me.solo ? " · 혼자 체험" : " · " + me.room);
    $("activity").innerHTML = activityHtml();
    activityInit(loadLocal());
    startDraft();
    show("stage");
  }

  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "null"); }
    catch (e) { return null; }
  }

  function startDraft() {
    if (draftTimer) { clearInterval(draftTimer); }
    if (typeof activityDraft !== "function") { return; }
    draftTimer = setInterval(function () {
      try {
        var d = activityDraft();
        if (d) { wiseDraft(d); }
      } catch (e) {}
    }, 8000);
  }

  function submit() {
    var payload = activityCollect();
    if (payload === null) { return; }

    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(payload)); } catch (e) {}

    if (me.solo) {
      $("w-msg").innerHTML = '<span class="ok">이 기기에만 저장했어요. 혼자 체험 중이에요.</span>';
      return;
    }

    var record = {
      nick: me.nick, group: me.group, app: APP,
      room: me.room, at: Date.now(), payload: payload
    };

    $("w-sync").textContent = "저장 중...";
    dbPush(me.room + "/entries", record).then(function () {
      $("w-sync").textContent = "저장됨";
      $("w-msg").innerHTML = '<span class="ok">제출했어요. 고쳐서 다시 제출해도 괜찮아요.</span>';
      sheetBackup(record);
    })["catch"](function () {
      $("w-sync").textContent = "저장 실패";
      $("w-msg").innerHTML = '<span class="warn">인터넷이 불안정해요. 쓴 내용은 이 기기에 남아 있어요. 잠시 뒤 다시 제출해 주세요.</span>';
    });
  }

    dbGet(me.room + "/entries").then(function (data) {
      var rows = [];
      for (var k in data) { if (data.hasOwnProperty(k)) { rows.push(data[k]); } }
      rows.sort(function (a, b) { return (a.at || 0) - (b.at || 0); });

      var latest = {};
      for (var i = 0; i < rows.length; i++) { latest[rows[i].nick] = rows[i]; }
      var list = [];
      for (var n in latest) { if (latest.hasOwnProperty(n)) { list.push(latest[n]); } }

      $("t-count").textContent = list.length + "명";
      $("t-note").textContent = noteFor(list, rows.length);
      $("t-summary").innerHTML = teacherSummary(list);
      $("t-table").innerHTML = teacherTable(list);
      window.__wiseRows = list;
      if ($("present").className === "") { paintPresent(list); }
    })["catch"](function () {});
  }

  function noteFor(list, tries) {
    if (!list.length) { return "아직 제출이 없어요. 학생에게 방 코드를 알려 주세요."; }
    var groups = {}, n = 0;
    for (var i = 0; i < list.length; i++) {
      var g = list[i].group || "모둠 없음";
      if (!groups[g]) { groups[g] = 0; n++; }
      groups[g] += 1;
    }
    var last = 0;
    for (var k = 0; k < list.length; k++) { if (list[k].at > last) { last = list[k].at; } }
    return "모둠 " + n + "개 · 제출 시도 " + tries + "회 · 마지막 제출 " +
      new Date(last).toLocaleTimeString("ko-KR");
  }

  function paintPresent(list) {
    var html = "";
    try {
      html = (typeof presentHtml === "function") ? presentHtml(list) : teacherSummary(list);
    } catch (e) { html = teacherSummary(list); }
    $("p-title").textContent = "우리 반 결과 · " + list.length + "명";
    $("p-body").innerHTML = html;
  }

  function teacherTable(list) {
    var h = "<tr><th>닉네임</th><th>모둠</th><th>제출 시각</th><th>내용</th></tr>";
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      h += "<tr><td>" + esc(r.nick) + "</td><td>" + esc(r.group) + "</td><td>" +
        new Date(r.at).toLocaleTimeString("ko-KR") + "</td><td>" +
        esc(JSON.stringify(r.payload).slice(0, 180)) + "</td></tr>";
    }
    return h;
  }

  function toCsv(list) {
    var lines = ["닉네임,모둠,제출시각,내용"];
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      lines.push([r.nick, r.group, new Date(r.at).toLocaleString("ko-KR"),
        JSON.stringify(r.payload)].map(function (v) {
          return '"' + String(v).split('"').join('""') + '"';
        }).join(","));
    }
    return lines.join("\n");
  }

  function download() {
    var list = window.__wiseRows || [];
    var blob = new Blob(["\ufeff" + toCsv(list)], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = APP + "_" + me.room + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  /* ---------- 연결 ---------- */

  $("w-enter").onclick = function () { enter(false); };
  $("w-solo").onclick = function () { enter(true); };
  $("w-teacher").onclick = function () { show("teacher"); };
  $("w-submit").onclick = submit;
  $("w-leave").onclick = function () {
    if (timer) { clearInterval(timer); }
    if (draftTimer) { clearInterval(draftTimer); }
    show("gate");
  };

  $("t-make").onclick = teacherMake;
  $("t-open").onclick = function () {
    var code = onlyDigits(prompt("방 코드 6자리를 넣어 주세요.") || "", 6);
    if (code.length === 6) { teacherOpen(code, ""); }
  };
  $("t-back").onclick = function () { if (timer) { clearInterval(timer); } show("gate"); };
  $("t-refresh").onclick = teacherRefresh;
  $("t-csv").onclick = download;
  $("t-detail").onclick = function () {
    var open = $("t-wrap").className.indexOf("hide") < 0;
    $("t-wrap").className = open ? "scroll hide" : "scroll";
    this.textContent = open ? "낱낱이 보기 켜기" : "낱낱이 보기 끄기";
  };
  $("t-present").onclick = function () {
    paintPresent(window.__wiseRows || []);
    show("present");
  };
  $("p-close").onclick = function () { show("teacher"); };
  $("t-lock").onclick = function () {
    dbPut(me.room + "/meta/locked", true).then(function () { alert("방을 잠갔어요."); });
  };
  $("t-copy").onclick = function () {
    var code = $("t-code").textContent;
    var done = function () { $("t-copy").textContent = "복사됨";
      setTimeout(function () { $("t-copy").textContent = "복사"; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done)["catch"](function () { fallbackCopy(code, done); });
    } else { fallbackCopy(code, done); }
  };

  /* 구글 사이트에 끼워 넣었을 때는 상단바를 숨긴다. 따로 열었을 때만 길을 보여 준다. */
  try {
    if (window.self === window.top) {
      $("w-top").className = "wtop";
      $("w-restart").onclick = function () {
        if (timer) { clearInterval(timer); }
        if (draftTimer) { clearInterval(draftTimer); }
        show("gate");
      };
    }
  } catch (e) {}

  /* 입장 화면에 이 활동을 소개하는 그림을 깐다. 혼자 열어 본 학생을 위한 것이다. */
  if (typeof activityIntro === "function") {
    try {
      $("w-intro").innerHTML = activityIntro();
      $("w-intro").className = "intro";
    } catch (e) {}
  }

  /* 자동 검사용 통로. 수업 화면에는 영향이 없다. */
  if (typeof window !== "undefined") {
    window.__wiseTest = {
      app: APP,
      activityHtml: activityHtml,
      activityInit: activityInit,
      activityCollect: activityCollect,
      teacherSummary: teacherSummary,
      presentHtml: (typeof presentHtml === "function") ? presentHtml : null,
      activityAutofill: (typeof activityAutofill === "function") ? activityAutofill : null,
      setMe: function (v) { me = v; }
    };
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { alert(text); }
    document.body.removeChild(ta);
  }
})();
</script>
